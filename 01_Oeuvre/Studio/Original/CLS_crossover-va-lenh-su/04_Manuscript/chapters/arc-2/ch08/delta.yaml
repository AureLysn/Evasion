      evidence: "「“忆庭里有一些人，一直在偷偷收集一样东西。”」 · 「屋里，黑天鹅说：“我走到这里，就回头了。”」 · 「“后面的，”她说，“我也是头一回看。”」 · 「“我那时候，”黑天鹅说，“是真的挑不动。”」"
