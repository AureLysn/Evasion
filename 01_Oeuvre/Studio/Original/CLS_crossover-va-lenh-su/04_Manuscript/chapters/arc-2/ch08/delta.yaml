      evidence: "「“……这是我的脸。”她说。」 · 「“凭什么不记得我！”」 · 「“……这段，”她说，“我不记得。”」 · 「“我们凭什么，替别人选？」 · 「“我就说嘛！”她说，“我问得多好！”」 · 「“第一个是杰森，我听出来了。第二个呢？”」"
