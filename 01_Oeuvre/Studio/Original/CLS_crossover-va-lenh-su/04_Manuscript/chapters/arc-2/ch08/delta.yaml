      evidence: "「“我叫长夜月。”她说」 · 「“我是她点的那支蜡烛，落下来的影子。”」 · 「“你不是那些人。”」 · 「“还给你。”她说。」 · 「“我要睡一会儿。”长夜月说，“醒着的时候，当心忆庭。”」"
    stelle:
      state: "Phim va phong. Phim: o sau 涡心 gat dau Hysilens; hoi Evernight ve March; bi keo vao cho quen; o tau gia khong ai nho March; chim sau hon; o dai mo dung truoc mot hoc, khong cham; chup Evernight bang may anh cua March; dat tay len suc nang. Phong: lan dau nhin nguoi truoc tuong; dua ve 黑泥 va chen ruou; treu Dan Heng; hoi March khoc chua; tra loi 'tuong chi cho hai chu'."
      evidence: "「星朝她点了一下头，那个影子也点了一下。」 · 「这一路看下来，她头一回先看人，后看墙。」 · 「“黑泥请人喝东西，”星说，“杯子还是空着端上来的。”」 · 「她举起来，对准长夜月，按下快门。」 · 「“墙只给了两个字。”星说。」"
    dan-heng:
      state: "Phim va phong. Phim: ve tau, thay phong March trong, 'toi quay lai'; tro lai cung 赞达尔, tu choi loi de nghi; danh thu khong lo, bong duoi chan doi khac (khong ten), nhan hoa chung Dai Dia, da dung len theo; goi mat khau bai; tim thay Stelle 'mot nguoi cung khong bo lai'; ghep su that thanh kiem. Phong: '97 ngay'; 'toi biet'; 'la anh ay' (ve cai bong, khong ten); khong rut tay ao khi March up mat."
      evidence: "「“我回去。”他说。」 · 「“不用。”丹恒说。」 · 「“是他。”屋里的丹恒说。」 · 「“说好了，”他说，“一个都不落下。”」 · 「丹恒没有把袖子抽回去。」"
