# Nguon chuong: ch05-chapter.md ban HIEN TAI (tieng Trung, POV phong Phainon, status draft, last_updated 27/10, sau soat mach V1-V3, N1-N6). Delta doc theo THAN CHUONG, khong theo plan.
# Moi dong evidence = nguyen van ban hien tai (kiem bang may: moi cum 「…」 la chuoi con cua than chuong).
# Cho can Aurel quyet danh dau "AUREL (n)"; moi muc co MAC DINH an toan. Aurel chua tra loi = chua ap mac dinh.
#
# ===== `secrets: {}` =====
#   Than chuong khong co nguoi trong phong doan trung bi mat nao. Nguoi o hang tap hoa khong ten (「那人」); khong ai goi ten Jason / Dazai / Tsuna / Khaslana; khong cuoc goi, khong hop den.
#   Cyrene chi la giong va hinh be gai toc hong; Khaslana chi la bong ao den bat dau buoc, khong ai goi ten. KHONG them known_by / suspected_by.
#
# ===== Hook h-cho-trong-phan-dien (mac dinh an toan Đ-3) =====
#   Loi moi cua Lygus (来古士) KHONG tinh la buoc cua hook: than chuong khong noi xem o dau, khong chu 座位/椅子/席/观剧台/神话之外, khong goi nguoi o hang tap hoa la khan gia.
#   Nen KHONG them dong Tien do. `hooks: {}`. Cac hook khac khong cham (khong cuoc goi, hop den, 黑泥).
# ===== Chot Aurel 27/10 =====
#   Dazai khong cham bay Cyrene. Dieu kien 「我去看。不上台，不接词。」 dung muc than chuong: khong nhac Cyrene, ky uc, cuon sach, vong lap; khong chu 写.
#
# Quy uoc ten: 白厄 = Phainon, 星 = Stelle, 三月七 = March 7th, 丹恒 = Dan Heng, 姬子 = Himeko, 瓦尔特 = Welt, 螺丝咕姆 = Screwllum, 星期日 = Sunday,
#   来古士 = Lygus, 昔涟 = Cyrene, 迷迷 = Mem, 万敌 = Mydei, 阿格莱雅 = Aglaea. Nguoi o hang tap hoa = 「那人」 (khong ten).
# Khung: phong chieu (Phainon POV) xem tiep: dem Okhema duoi man cau vong, Dan Heng giao 识刻锚 cho Stelle o lai -> Phainon + Stelle gap Lygus o Vortex, hai dieu kien
#   -> Lygus moi nguoi o hang tap hoa xem doan ket, nguoi do dat dieu kien va di khoi man -> March 7th trong Path Space, giong Cyrene -> man 启程 / 试炼 / 归返 -> bong ao den buoc ra, March xin dung, Phainon noi 「别停」.

