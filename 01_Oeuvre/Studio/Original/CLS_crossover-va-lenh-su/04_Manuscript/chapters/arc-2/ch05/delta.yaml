  characters:
    phainon:
      state: "Phong chieu, POV. Khong nho cau tin don o cuoi hem (「那一夜的奥赫玛，他记得的事不少，这一句不在里头」), khong suy ra gi. Xem chinh minh thuong luong hai dieu kien o Vortex, nghe minh noi 「平平安安」, bam ngon cai vao long ban tay. Biet Lygus o Vortex dem do; khong biet mot than khac cua Lygus da ra cho, khong co an tuong gi ve nguoi ngoi tren thung go. Nghe giong Cyrene noi 「别信」, khong quay sang March. Cuoi chuong: March xin dung, Phainon noi 「别停」 truoc khi Himeko tra loi, giong thap den la voi chinh anh; mat dinh vao bong ao den."
      evidence: "「那一夜的奥赫玛，他记得的事不少，这一句不在里头。」 · 「白厄看着墙上的自己谈这笔买卖，听着自己说“平平安安”四个字，拇指在掌心里按了一下。」 · 「至于木箱上的这个人，他一点印象也没有。」 · 「白厄听见了那两个字。他没有转头，眼睛一直看着墙，没往三月七那边偏过半寸。」 · 「“别停。”白厄说。」 · 「声音比他预想的低，低得连他自己都觉得陌生。」"
    stelle:
      state: "Phong chieu. Nhan o lai trong the gioi du lieu, giu 识刻锚 (「我留」). Tren phim: khi Lygus tu choi dieu kien thu hai, noi 「我有办法」 (khong giai thich). Trong phong: noi 「我本来也没打算走」; hoi 「那箱子撑得住他吗？」 ve Lygus ngoi tren thung go; choc March ve 「战术性前进」; ke trong 启程 khong ai thay minh, ke ca con cho chi sua mot tieng. Lien mat nhin Phainon mot lan, khong noi gi."
      evidence: "「“我留。”星说，答得比装置还快。」 · 「星抬起手里的识刻锚，晃了晃。“我有办法。”她说，只有这一句，没有往下解释。」 · 「“我本来也没打算走。”星说，眼睛没离开墙。」 · 「“那箱子撑得住他吗？”星说。」 · 「“那是我的词。”星说。」 · 「“我在里头走了一路，”星说，“除了那两个小的，谁也看不见我。有个孩子直接从我身上穿过去了。”」 · 「星转头看了他一眼，又转了回去。」"
    march-7th:
      state: "Phong chieu va tren phim. Tren phim: tinh o Path Space (命途狭间), nghe goi 「三月七」, gap Dan Heng va Stelle gia, nghi ngo (「怎么感觉哪儿怪怪的」), nghe giong bao 「别信」, giong tu xung 昔涟 noi Stelle va Dan Heng da di, March di ve phia anh sang. Trong phong: lam Screwllum ket chu (「螺丝咕姆卡壳了」); sau canh Path Space khong cuoi nua, nhac 「她那时候……一直在说别信」; cuoi chuong dung day xin dung, ngon tay hoi run, mat dinh vao bong ao den. Himeko ap tay, March ngoi xuong."
      evidence: "「“怎么感觉哪儿怪怪的……”」 · 「“我是昔涟。”声音答。」 · 「“那我也去。”她说，“他们都去了，我总不能一个人躺在这儿。”」 · 「三月七没有再笑。她看着墙上那片光渐渐暗下去，过了一会儿，说：“她那时候……一直在说别信。”」 · 「“等一下，”三月七一下子站了起来，“停一下行不行？”」 · 「她的手指着墙，指尖有一点抖，眼睛盯着那个黑影，不看别处。」 · 「三月七慢慢坐回去。」"
    dan-heng:
      state: "Phong chieu va tren phim. Tren phim: giao 识刻锚 cho Stelle, tu ve tau (「我回列车」), khong tra loi them, khong quay dau lai; giu tay Stelle truoc bong ao den dung hinh (「别动，它定住了」). Trong phong: noi minh khong quay dau (「我走的时候，没回头」); noi 「他先提了条件」 khi March hoi ve nguoi o hang tap hoa; phan biet Stelle that va gia bang cach noi cua minh."
      evidence: "「“你留下，”丹恒说，“我回列车。里面要有人看，外面也要有人接。”」 · 「丹恒按住她的手腕：“别动，它定住了。”」 · 「“我走的时候，没回头。”丹恒看着墙说。」 · 「“他先提了条件。”丹恒说。」 · 「“还有，我不会说‘大家都在等你’。我只会说‘该走了’。”」"
    himeko:
      state: "Phong chieu. Giu nhip: 「接着看」 / 「接着」 / 「看」 nhieu lan. Khong chan Phainon. Khi nghe 「别信」 ly dung giua khong, khong dat xuong. Cuoi chuong khong tra loi March, ap tay len tay March va nhe nhang an xuong."
      evidence: "「“接着看。”姬子说。」 · 「姬子把杯子端起来。“看。”」 · 「“接着。”姬子说。」 · 「姬子的杯子停在半空，没有放下。」 · 「姬子没有回答。她把手覆上三月七的手背，轻轻往下压。」"
    welt:
      state: "Phong chieu. Noi 「先看完这一段」 sau cau tin don. Vet nut tren kinh dai them mot doan sau canh 启程, khong neu vi tri; Himeko nhin, khong hoi."
      evidence: "「“先看完这一段。”瓦尔特说。」 · 「瓦尔特抬手按了一下眼镜框的边缘。镜片上那道裂又往前爬了一段。他没有说爬到了哪里。姬子看了他一眼，没有问。」"
    screwllum:
      state: "Phong chieu va tren phim (thiet bi lien lac Dan Heng cam). Tren phim: bao the gioi dung tu du lieu, can mot nguoi o lai, 识刻锚 chi mot nguoi mang, khong nen hai nguoi cung o lai; tin cuoi bi den. Trong phong: ket chu mot lan khi Lygus goi anh la dong bao (「结论：称呼……」, logic khong den), Stelle noi 「头一回」. Khong khen."
      evidence: "「“结论：此界由数据搭成，需要一个人留在里面，当耳目。逻辑：里面的人看得见，外面的人才有办法。”」 · 「“结论：不建议两人同时留下。逻辑：两处同时持锚，里外都会失真。”」 · 「“结论：称呼……”螺丝咕姆开了口，停住了。照例该跟上来的“逻辑：”，没有来。」 · 「“结论：虫蛀与我无关。逻辑：线路不是我铺的。”」"
    sunday:
      # Chua co note; khoa ky thuat neu co.
      state: "Phong chieu. Mot cau ve Lygus: dieu kien thu nhat duoc nhan qua nhanh (「第一条，他答应得太快。」). Khong them."
      evidence: "「“第一条，他答应得太快。”星期日说。他只说了这一句。」"
    dazai:
      # Khoa ky thuat Characters/dazai.md. TREN TRANG khong ten: 「那人」. Aurel 27/10: khong cham bay Cyrene; dieu kien khong gan voi bay.
      state: "Phim (Okhema, cho duoi man cau vong, dem). Ngoi tren thung go lat, so bia trong khong mo, goi banh mat ben chan, an cham, nhin ve phia dong nguoi. Lygus toi ngoi canh, noi vo dem nay moi vai da xep xong, chi khong co vai cho nguoi nay, roi moi xem doan ket (khong noi o dau). Nguoi do khong tra loi ngay, go mot cai len bia so. Truoc khi Lygus noi het: 「我去看。不上台，不接词。」 (giong nhe, co cuoi). Lygus dung mot nhip, nhan loi. Nguoi do gap mieng giay goi banh, kep so duoi nach, dung day; tu choi tay chi duong cua Lygus (「我自己会走」), tu buoc ra khoi man cau vong, khong dung, khong quay dau; may quay o lai trong man. Dieu kien khong nhac Cyrene, ky uc, cuon sach, vong lap. Ngoai hinh: toc nau roi, mi mat nua cup, ao khoac ngan xam xanh; khong ta co tay."
      evidence: "「那人还坐在翻过来的木箱上，册子压在膝头，封面空白，边角磨得起了毛，没有翻开。」 · 「脚边放着一只纸包，口折过一道，里头是蜜饼。深棕色的头发乱蓬蓬地翘着，眼皮半耷拉着，灰蓝的短外套在红光蓝光里换了好几回颜色。」 · 「唯独没有给阁下留。」 · 「那人没有答。他把咬剩的半块放回纸包，手指在册子的封面上敲了一下，很轻，只一下。」 · 「“我去看。”那人说，嗓音不高，带着一点笑，“不上台，不接词。”」 · 「“不用，”那人说，“我自己会走。”他没有理会那个手势，自己迈了出去。」 · 「他走出幕的那一步，没有停，也没有回头。」"
    lygus:
      # Canon NPC (来古士), chua co note project. Ngoai hinh o Amphoreus-npc-ngoai-hinh (da chep 27/10). Tren trang: 「来古士」 / 「那位」 (khong dung 「那人」, danh cho nguoi o hang tap hoa).
      state: "Phim (Vortex 创世涡心 va cho). Tu nhan tri tue co, nguoi Antikythera, di menh do Tri tue (智识命途); goi Screwllum la dong bao. Nhan dieu kien thu nhat cua Phainon, tu choi dieu kien thu hai (dua Stelle ve nha) vi 「缠得太深」, tra loi nhanh khong de hoi them. Nhan hai nua mam lua cua Phainon va Stelle. Mo man 《英雄之旅》. Sau do mot than khac ngoi canh nguoi o hang tap hoa, moi xem doan ket, khong noi xem o dau; nhan dieu kien 「不上台，不接词」 va dan di. Cuoi chuong dung giong nguoi dan moi mot dien vien quan trong khac buoc len, bong ao den hien."
      evidence: "「“来古士。”白厄说，一个字也没多给。」 · 「“正是在下。智械之身，安提基色拉之人，走智识命途的行者。”」 · 「“头一条，应允。”来古士竖起一根手指，又收了回去，“第二条么，恕在下不能从命。这位小姐与这个世界，缠得太深了。”」 · 「“字面上的意思，仅此而已。”来古士答得很快，快得不容人追问。」 · 「他笑了。“哈，哈。”两声，间隔分毫不差」 · 「“不接词的人，才更值得一看。”他把手收回膝上，“好，依阁下。那么，请随在下来。”」 · 「“诸位，最后一幕，还缺一位要紧的演员，请他登场吧！”」"
    cyrene:
      # Canon NPC (昔涟), chua co note project. Chi toc hong, tai nhon (TextMap). Aurel 27/10: khong cham bay.
      state: "Phim. Giong (chua co hinh) trong Path Space: noi nhanh, nhac 'dung tin' nhieu lan, tu xung 昔涟, noi bi nhot, khong cho March hoi them, chi cua. O man 启程: be gai toc hong, tai nhon, om cuon sach bia day, ghe voi be trai toc trang. O 试炼: lon hon, toc hong, tai nhon, noi 「我就在这里学习的」. Chuong khong cho Cyrene cham den bay nao."
      evidence: "「“我是昔涟。”声音答。」 · 「“别信，别信。”」 · 「“说来话长，说来话长。”声音说得很快，没给她追问的空当，“先说门。”」 · 「另一个是女孩，头发是粉色的，耳朵尖尖，怀里抱着一本很厚的书，深色的封皮，书角顶在她的下巴上。」 · 「声音比小时候低了一点，尾音仍旧又轻又快。」"
    mydei:
      state: "Phim (试炼, nhip ngan). Dung truoc thien binh, doi dien Phainon luc lon hon, noi 「来，让我看看你」. Khong thoai khac."
      evidence: "「对面是万敌，红黑的披风搭在肩上，红色的纹路从胸口一直爬满手臂。“来，”他说，“让我看看你。”」"
    aglaea:
      state: "Phim (试炼, nhip ngan). Di xuong bac da, dua mot soi chi cho Phainon: 「从今天起，你是我们中的一个。」 Khong thoai khac."
      evidence: "「阿格莱雅从石阶上走下来，金色的月桂环，金线在她指间绕了半圈。她看了白厄一眼，把一根线递到他手里，说了一句：“从今天起，你是我们中的一个。”」"

