      evidence: "「“灰烬。”不死途的声音从门边传来。…“你做得很好。”」 · 「“还要动手吗？”」 · 「“手呢？”」 · 「“我知道你有朋友。”不死途的声音从冰柜里传出来，闷闷的，“我不问第二遍。”」 · 「“我也不会问你，你是打哪儿来的。”」 · 「“别在有人的地方这么叫。”不死途说。」 · 「“猴子是人。”」 · 「“我出去一趟。”他说，“世界尽头酒馆。”」 · 「“账，”他说，“月底我给你结。”」"
    kuchiba:
      state: "Phim (8.01). Dua ba nguoi (赤焰 · 苍翼 · 曙光) va Magnus toi toa nha Synwish, tay deo cong 'moi' (nhu ch07). Noi voi Jason: «那几下，我写进报告了。» — «必要.» Voi Ashveil: «该说的都说了。他们不记得的，我问不出来.» — «我信他们现在的样子。以后的样子，我没法替人保证.» Noi voi Hayek: «人我带回来了。怎么处置，我和鸽川的人商量。你可以说话.» Khong ra phan quyet tren man hinh. Khong dem dau chan (quyet dinh 3)."
      evidence: "「朽叶经过杰森身边，脚步没停，低声说了一句：“那几下，我写进报告了。”」 · 「“必要。”她说。」 · 「“该说的都说了。”朽叶也压着嗓子，“他们不记得的，我问不出来。”」 · 「“我信他们现在的样子。”她停了一下，“以后的样子，我没法替人保证。”」 · 「“人我带回来了。怎么处置，我和鸽川的人商量。你可以说话。”」"
    magnus:
      # 灰烬. Chua co note project (xem new_entities). Chi ghi chi tiet ch08.
      state: "Phim (8.01). Di cuoi doan Canh Binh, thay quan phuc sach; ngoi sao vang cuoi nguc gan lai o cho cu — 「是正的」 (Jason hoi/nhan xet; 'no khong nghieng nua'). Buoc ra giua ba nguoi va Hayek, quay lung ve ba nguoi, noi: «哈耶克小姐，我……不能替他们说对不起。他们是很好的人。真的。他们做了很大的错事，我知道。可他们是很好的人。» Mong ho 'nghe tan tai'. Ashveil khen — mat do, 'xin doi chu de'. Khong noi gi them."
      evidence: "「灰烬跟在最后，换了一身干净的制服，胸口那颗金星缝在原处，是正的。」 · 「“它没再歪过。”」 · 「灰烬往前走了一步，走到了三个人和柜台之间，背对着他们，面向她。」 · 「“哈耶克小姐。”他说，声音不稳，“我……不能替他们说对不起。”」 · 「他们是很好的人。真的。他们做了很大的错事，我知道。可他们是很好的人。」 · 「灰烬的脸一下子红透了。“您……您别当着大家夸我，”他小声说，“能不能……换个话题？”」"
    hayek:
      # 哈耶克. Chua co note project (xem new_entities). Canon: Imagenae, tiep tan, nguoi song sot duy nhat (ch02 da chot, Aurel 13/10).
      state: "Phim (8.01). Dung sau quay le tan, 'chan khong cham dat', than the mo toi muc thay lich tuong qua nguoi (幻造体). Nhin ba nguoi tu cua rat lau; noi dung ba chu: «三十三个。» (giong nhe, 'nhu doi so'). Khong quat, khong tha, khong noi them. Trong khi Magnus noi: khong dap. Khi Kuchiba noi 'ban co the noi', lat tam bang 「营业中」 sang 「休息中」, khong noi gi. Khong de cap bang giam sat cua Skott."
      evidence: "「得说“站着”，因为她的脚没有踩在地上。…身形却淡得能看见后头墙上的挂历，边缘微微发虚。幻造体」 · 「她看了很久。」 · 「“三十三个。”她说。她只说了这三个字。声音轻，轻得像在对账。」 · 「她伸出手，把柜台上那块小牌子翻了个面，“营业中”变成了“休息中”。」"
    chi-yan-cang-yi-shu-guang:
      # 赤焰 · 苍翼 · 曙光 — gop mot muc. Chua co note project.
      state: "Ba Chien Binh Biet Doi Binh Minh, 8.01. Sau ba ngay tham van, da 've lai' la nguoi, KHONG phai quai vat: tay deo cong; 赤焰 tay trai nep 'treo trat ngang, treo lech'; 苍翼 tay giu soc suon; 曙光 lung khong thang nen, thu ep tay minh cuoi cung bo. Khong ai quy, khong ai khoc xin: 赤焰 dang hat 'Biet Doi Binh Minh' thi nuot lai, chi con «我们来了。»; 苍翼 muon noi «按规定», mo mieng, khong ra tieng; 曙光 cui dau roi ngang len, 'cao hon luc nay'. Khong ai noi gi voi Jason."
      evidence: "「赤焰的左臂用一块夹板吊在胸前，吊得歪歪扭扭。苍翼走路时一只手始终按着肋下。曙光的腰直不起来，她大概想起了从前的姿势，试着挺了一下，没能挺起来，索性放弃了。」 · 「那是句喊到一半的“破晓战队”，被他咽了回去，只剩一声很小的：“我们来了。”」 · 「赤焰的嘴唇动了一下，他把下巴抬起来，对着她站直。苍翼想说“按规定”，开了口，没有出声。曙光低了一下头，又抬起来，抬得比刚才更高。」"
    pho-canh-binh-moi-ba-nguoi:
      # Ba Canh Binh moi (矮壮 · 穿斗篷 · 戴机械手套) — khong ten, nhan vat mot chuong; cung nhom da o ch06–ch07 trong phong.
      state: "Phong chieu. Khong ten. Mot nguoi (矮壮) noi «他们要是跪下，我就走。» — «跪下就是在讨价。这种事不讨价.» Nguoi (斗篷) doi y: «找到的时候…他睡在冰柜里，让猴子记账…现在我不想带他走了.» Nguoi (机械手套) hoi: «他到底是谁的人.» (xoay tu 'lanh dao' sang 'nguoi cua ai'.) Ba nguoi nhin Boothill moi khi khong chot duoc; ho de Boothill chot. Cuoi chuong di theo thu tu luc toi."
      evidence: "「“他们要是跪下，”他说，“我就走。”」 · 「“跪下就是在讨价。”他说，“这种事不讨价。”」 · 「“现在我不想带他走了。”她说。」 · 「“所以我想知道，”年轻人把帽檐往上推了一寸，“他到底是谁的人。”」 · 「他们每次拿不定主意，都会往他这边看。」"
    crowd-and-staff:
      # Nguoi dan Dovebrook o xa (ban hang桂花糕). Khong note, khong ten.
      state: "Chu quay ban 桂花糕 thu quay, dung o cua nhin tu xa, khong lai gan. Ong lao ban hoa khong nhan tien Sunday. Khong co hanh dong khac."
      evidence: "「街角卖桂花糕的小摊收了摊，摊主站在门口张望，没有走近。」 · 「卖花的老人不肯收钱，他硬塞了一把愿宝才走。」"

