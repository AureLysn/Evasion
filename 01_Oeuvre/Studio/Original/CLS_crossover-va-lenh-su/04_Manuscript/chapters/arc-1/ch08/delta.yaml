  characters:
    boothill:
      state: "Phong chieu, POV. Cuoi chuong tro thanh nguoi quyet dinh cua nhom Canh Binh moi: ba Canh Binh nhin ve han moi lan khong dinh ro; han im, khong tranh. Noi hai cau hoi to (Jason tu dau toi / lay gi ma chac), nghi ve viec tim 'lanh dao' bao nhieu nam va gap nguoi ngu trong tu lanh, dem chuoi cho khi — khong biet con mau, khong biet sau. Chot: 「我去。」 / 「去问。去他面前问。」 (khong 'bat ve', chi 'hoi'). Cho Aventurine di truoc, doc thanh 'di cuop truoc'. Nhin Rappa noi ve bay khi: khong dap. Ra sau cung, thay dau hieu guong/suong tren tuong, la nguoi dau tien len tieng: 「你们看墙。」"
      evidence: "「“我去。”他说。」 · 「“去问。”波提欧说，“去他面前问。”」 · 「“我不去搅。”波提欧说，“我去问。”」 · 「波提欧看着那扇门，心里很清楚：砂金不是去报账的，是去抢先的。」 · 「他本来盘算着，见了面该先骂一顿，再拎着衣领把人拽回去。看了这一晚，他拿不准这两件事还做不做得出来。」 · 「“喂，”他开口，“你们看墙。”」"
    stelle:
      state: "Phong chieu. Dem nhung cho khac ky uc (「没有人被吞掉」, 「姬子没有留在下面」, 「失踪的人，比我记得的少」), dung o chu 「受伤的人……」 — khong dem tiep. 「我记得的那一版，没有这么多人自己走出来。」 Biet ten 「小鸟」, 「黑泥」 'tren phim' nhung 「记不起来」. Khong tham gia chon Boothill; xin di cung, Welt can. Thay dau hieu cuoi 'lanh' (「冷。这个冷。」)."
      evidence: "「“我数一下。”…“没有人被吞掉。姬子没有留在下面。受伤的人……”她停了一下，没有往下数，“失踪的人，比我记得的少。”」 · 「“我记得的那一版，没有这么多人自己走出来。”」 · 「“这些名字，”星说，“画面里的我都认识。”」 · 「“记不起来。”星把球棒顶在地上」 · 「“冷。”星说，“这个冷。”」"
    himeko:
      state: "Phong chieu. Dem tinh: 「还有一个小一点的。他打电话给谁。」 Hoi Sunday: 「你想知道是谁，是想谢他，还是想问他？」 — 「想好了，我们陪你找。」 Noi ve Jason: 「他的屋子，他的猴子，他的香蕉。我们别去搅。」 Cuoi buoi chieu xep ly, tay dung lai o chiec thu ba. Khong nhac 'o cho co, nguoi o lai la co' (ch07)."
      evidence: "「“还有一个小一点的。”姬子说，“他打电话给谁。”」 · 「“你想知道是谁，”姬子问，声音很轻，“是想谢他，还是想问他？”」 · 「“想好了，”姬子说，“我们陪你找。”」 · 「“他的屋子，他的猴子，他的香蕉。”姬子说，“我们别去搅。”」 · 「姬子把杯子一个一个收拢，叠在一起，叠到第三个，手停了停，又拆开，重新摆好。」"
    welt:
      state: "Phong chieu. Vet nut tren mat kinh khong lan them: 「镜框边上那几道细叉停着，没有再长。他没有去碰。」 Noi: 「有些人是看见了才信，有些人是信了才去看」, 「公司从来不等人讨论完」, va chot cuoc ban: 「画面没有回答我们。有些问题，得走到那个人面前，亲口去问。」 Can Stelle di cung Boothill: 「会吓到他」. Cuoi chuong 'kinh co vet nut lap lanh trong suong' khong doi."
      evidence: "「瓦尔特的手搭在手杖上，镜框边上那几道细叉停着，没有再长。他没有去碰它。」 · 「“画面没有回答我们。”他说，声音不高，“有些问题，得走到那个人面前，亲口去问。”」 · 「“公司从来不等人讨论完。”瓦尔特说。」 · 「瓦尔特没有动，镜片上那条裂痕，在霜里亮了一下。」"
    sunday:
      state: "Hai noi: (a) PHIM (8.01): den vieng Synwish, mot chum hoa trang buoc day gai, hoa mua tren duong (lao ban khong nhan tien, anh nhet mot nam 愿宝), nhin anh ba muoi ba anh tren tuong; noi voi anh Polwave: 「您托付的事，办完了。」 va 「这栋楼欠的说法，我现在还不起。」 Khong deo trang suc, vong sang thu gon. (b) PHONG (8.03–8.04): ngoi thang; noi duoc dieu minh nghe thay trong luc chinh am tren phim: mot giong 'dem duoi', 'hop voi toi'; 「我想知道是谁」; 「我还没想好」. Khi tuong hien guong/suong: dung o dau, khong cham, 「我只是在听」 — 「什么也没有。可是我听过这种没有。」 Cuoi chuong khong roi phong dau tien: ngoi nhin tay."
      evidence: "「星期日已经站在门口。…手里捧着一束白花」 · 「“池波先生。”星期日对着那张照片说。…“您托付的事，办完了。”」 · 「“这栋楼欠的说法，我现在还不起。”」 · 「“画面里调律的时候，”他说，“我听见了一个声音。”」 · 「“我想知道是谁。”」 · 「“我还没想好。”他说。」 · 「“什么也没有。”星期日说，“可是我听过这种没有。”」"
    aventurine:
      state: "Phong chieu. Trong ch08 chi noi hai lan: 「我先走一步。账上还有些事。」 va 「价钱留着。随时有效。」 — roi di truoc, nguoi dau tien dung day, 'khong nhin ai'. Cat dong xu vao tui. Khong cuoi, khong noi gia moi."
      evidence: "「砂金在这时候站了起来。他把硬币收进口袋，理了理袖口，是屋里第一个起身的。」 · 「“我先走一步。”他说，没有看任何人，“账上还有些事。”」 · 「“价钱留着。”他说，“随时有效。”」"
    march-7th:
      state: "Phong chieu. Giu may anh cang tay (chua chup duoc gi); nhin kien giay vang: 「我好像在哪儿见过」 — Dan Heng 「你见过」 va khong tra loi 'o dau'. Hoi Star 'goi la ai gui' — khong ai tra loi. Cuoi chuong cam may anh len, bam mot lan vao tuong den: 「什么都没拍上」. Tai hien tuong cuoi: 「它在照屋子！它在照我们进来之前的屋子！」"
      evidence: "「“那张纸，”三月七小声说，“金色的那个，我好像在哪儿见过。”」 · 「“你见过。”丹恒说。」 · 「“在哪儿？”丹恒没有答。」 · 「三月七把相机塞回包里，又掏出来，对着黑墙按了一下，看了看屏幕，嘟囔：“什么都没拍上。”」 · 「“它在照屋子！”三月七的声音压得很低…“它在照我们进来之前的屋子！”」"
    dan-heng:
      state: "Phong chieu. Noi hai lan 'vang vang' khong tra loi duoc: «你见过» (kien giay vang) va nhin vao mu ban tay minh, quay lai; ket cau 'nguoi dat ten khong gap'. Nhan ra dau hieu cuoi la KHAC: 「这不是箭头的光。」 Khong noi gi them."
      evidence: "「“你见过。”丹恒说。」 · 「丹恒没有答。他的视线从墙上移开，落在自己的手背上，又移回去。」 · 「画面里的星叫他【小鸟】，说是【黑泥】那家伙起的。起这个名字的人，我们一个都没见到。」 · 「“这不是箭头的光。”丹恒说。」"
    rappa:
      state: "Phong chieu. Vui: 「忍者的手心不出汗！」 (cuoi chuong dau, tu chua lai thanh 'ban hoi'), roi 「蹭灰」. Noi ve bay khi bang giong thang: 「那些猴子，晚上会守在他的冰柜边上。…从今天起，有人守着猴子了。」 — 「谁守谁？」 — 「在下不知道。在下只觉得，这样挺好。」 KHONG noi Moria, khong noi ve ai. Goi giong chinh am la 「唱歌的那位」. Chao Stelle truoc khi ra: 「球棒忍者，下回见！」"
      evidence: "「“忍者的手心不出汗！”Rappa 说」 · 「“蹭汗。”Rappa 说，“……蹭灰。”」 · 「“那些猴子，晚上会守在他的冰柜边上。”」 · 「“从今天起，有人守着猴子了。”」 · 「“在下不知道。”Rappa 说。她把脸转回墙上，“在下只觉得，这样挺好。”」 · 「“谁说得清呢，”Rappa 说，“唱歌的那位，在下连影子都没有看见。”」"
    jason-todd:
      state: "Phia duoc chieu, sau ba ngay (Kuchiba: 「审了三天」). Dung ngoai toa nha Synwish, 'khong vao'; nhin Magnus qua: 「星星是正的。」 Tra loi Ashveil: 「不用了。没我的活了。」 Tay phai co vet tray da: 「皮外伤」; ban chuoi 'khau tru y te' — «扣。您的那份。» Sang hom sau (hoac vai hom sau): dem chuoi 十二串 (hom qua 十四串), ghi vao so xanh; cho ong chu hai luat: chinh dong ho bo tui cham 12 phut. Nhan kien hang giay vang («贼寄的。别问。»): 「放下」 voi Nha Tho; 'khong cho Ashveil cham, doa tang tien chuoi gap doi'. Goi Ashveil 「领队」 lan thu hai, 'rat nho, khong kem dieu kien'. Nhan tin nhan, cuoi gian: 「那个犟种，我说了别寄了。」 Dat goi len tu cao nhat, canh dong ho cham 12 phut. Khong noi gi ve tu dau toi (「您也别问」)."
      evidence: "「杰森靠在楼外的墙上，看着灰烬从自己面前走过。视线在那颗星上停了一下。“星星是正的。”他说。」 · 「“不用了。”杰森说，“没我的活了。”」 · 「“皮外伤。”」 · 「“香蕉账里扣不扣医药费？”」 · 「“扣。”杰森说，“您的那份。”」 · 「十二串。昨天十四串。」 · 「“贼寄的。”杰森说，“别问。”」 · 「“……领队。”他说。」 · 「“那个犟种，”他对着屏幕说，“我说了别寄了。”」 · 「“您也别问。”」"
    ashveil:
