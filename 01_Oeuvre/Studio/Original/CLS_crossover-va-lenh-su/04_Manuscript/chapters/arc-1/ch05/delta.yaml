  characters:
    jason-todd:
      state: "Phia duoc chieu, ngay FES: Jason theo Ashveil (ao khoac dai thuong ngay, khong ria gia) den 星铁FES voi Stelle va March; tay phai dut tui ao khoac. Mot nhan vien nhet vao tay trai mot cay gay co vu, Jason cam cach mot canh tay nhu cam vat la, noi 「那我不拿了」 roi van giu. Khi 灰烬 (gap lan hai) hoi co xem 《破晓战队》 khong, Jason noi khong, 「我不爱看」; sau cau cua 灰烬 ve viec dong anh hung du lau thanh anh hung, Jason quay nhin Ashveil, Ashveil khong nhin lai. Khi ba chien binh Biet Doi Binh Minh (赤焰·苍翼·曙光) keu chup anh chung ca doi, Jason khong vao, lui them mot buoc ra khoi mep khung hinh truoc khi den flash; trong anh khong co Jason. O khu 「仙舟罗浮」, Jason lui ra sau mot cot trien lam, quay lung ve dam dong, nhin bang khoe mat: dem may quay (mot), micro (kenh 满愿电视台), ky gia thay vi tri; khi Stelle bi hoi, Jason ve ba gach ben le cuon so bia xanh, mot gach moi cau. Khi ban tin cat ghep len man hinh lon, Jason noi voi Ashveil: 「这场架是饵，老板。这条新闻才是钩。」; Ashveil 「嗯」. Jason dem: ba nguoi khong tho, mot nguoi tho; ghi them vao so: 「七分钟，两个镜头角度」, va nua dong ve dua tre be gay co vu quang xuong. Jason khong hoi Ashveil dang nhin gi. Khi Kuchiba den (2nd attack, dinh thap Pom-Pom, truoc khi troi toi) Jason dap 「选的地方够高。」. Cuoi ngay o chan thap: Jason dung mot bac duoi Ashveil, nhin ong vat tay ao, van tung dinh tan o co tay phai mot hoi lau; hoi 「老板，上去以后，您要做什么？」; Ashveil noi ong da doi mot thu o ban Pearl — 「不管我对谁做了什么，都没人能来找我清算」 — Jason khong hoi them, de cay gay vao be bac thang (dau con sang), rut sung, thao bang, dem dan, day lai, keo bao dan tay, mot tieng gion; roi hai nguoi di len theo bac thang."
      evidence: "「杰森跟在他右边，右手插在外套口袋里。」 · 「杰森举着它，隔了一臂远，捏法和捏一包来路不明的东西一样。」 · 「“那我不拿了。”」 · 「“没有。”杰森说。」 · 「“我不爱看。”」 · 「杰森转头看向不死途。 不死途没有回看。」 · 「杰森站在框外，没有动。……他往后退了一步，退出了取景框的右缘。」 · 「取景框里有四个战士，两个无名客，和不死途半截长外套的下摆。」 · 「杰森退到一根展柱后面，背朝着人群，用余光看。他先数摄像机：一台，扛在肩上。」 · 「在页边画了三道杠，一句一道，第一句旁边添了个小圈。」 · 「“这场架是饵，老板。”他说，“这条新闻才是钩。”」 · 「杰森数了数。三个人不喘，一个人喘。他在本子上添了一行：七分钟，两个镜头角度。」 · 「他没有问。老板在看什么，他看不出来，只看得出老板没打算说。」 · 「一个孩子扔了棒子。」 · 「“选的地方够高。”杰森说。」 · 「“老板，”他说，“上去以后，您要做什么？”」 · 「杰森没有再问。他把那根应援棒放到台阶边，棒头还亮着」 · 「从腰侧的枪套里抽出枪，卸下弹匣，对着最后一点天光数了数，推回去，拉动套筒。」 · 「两个人沿着台阶往上走。」"
