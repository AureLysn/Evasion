    robin:
      state: "Phong, POV, hang dau canh Sunday. Nghe truoc khi nhin: dem nhip cuoi cau cua nguoi do o 5.02 (day du hon 'lam khong duoc' cua ch04) va 5.06. 5.03: nghe 'xin loi' tren phim, tra loi MOT cau cho Sunday tren phim ('...toi biet'), khong quay sang Sunday (phong); quay lai MOT lan nhin kinh cua Welt, roi quay ve. 5.04: lan DAU nghe 'thay em gai', nghieng dau roi dung. 5.05: nghe chinh minh tren phim ('cung gom ca anh trai toi'), khong quay dau. KHONG biet nguoi o goc phong la ai. Khong noi ve cai chet cua minh."
      evidence: "「知更鸟没有接话。那一句收尾落到底才算数，和她唱歌时沉在嗓音底下的那个低音是同一个落点。」 · 「她面朝着墙，说得很轻：“……我知道。”」 · 「她答的是墙上那个人。」 · 「她回过头去。墙上的光落进他的镜片，镜片上那道裂纹比上一回又长了。她只看了这一眼，就转了回来。」 · 「【替妹妹】。知更鸟头一回听见这三个字。她朝身边偏了偏头，偏到一半，停住了。」 · 「知更鸟听见了自己的声音。【也包括我的哥哥】。她没有转头。」"
    sunday:
      state: "Phong. Khong ban phan ung lon, moi lan mot cai nho. 5.01: nguoi canh Robin ngay ca nhip tho cung khong doi khi tren phim noi 'khong phai ke giet nguoi'. 5.02: tay ao cham tay vin roi dung. 5.03: nin tho nhieu nhip khi 'xin loi' tren phim, roi tha ra; ngon tay go nhe len tay vin. 5.04: khong dap lai 'thay em gai'. 5.05: ngay ca vat ao cung khong phat tieng. 5.06: tay ao cham tay vin roi dung khi may quet goc; cuoi chuong tho ra mot hoi dai, khong noi gi. Khong ten nguoi nao."
      evidence: "「墙上那句【不是凶手】落进屋里，她身边的人连呼吸都没换。」 · 「星期日没有说话。知更鸟听见他的袖子擦过扶手，擦了一下，停了。」 · 「身边的星期日好几拍没有呼吸。知更鸟听着，一拍，两拍，数到第五拍，他才把气放出来。」 · 「身边的星期日没有转头。知更鸟听见他扶手上的指节轻轻叩了一下。」 · 「身边的星期日，连衣料也没有响。」 · 「镜头从角落扫过的那一瞬，知更鸟身边，星期日的袖子擦过扶手，停了。」 · 「身边的星期日呼出一口很长的气，什么也没有说。」"
    stelle:
      state: "Phong va phim. Phong: dem 'mot cuc da doi mot cau', nhac 'lan nay chi mot coc'; bu cau 'Lanh mat bao boi' cho Dan Heng; dap Firefly nho, co cuoi. Phim 3.8: Firefly thu truoc Stelle 'toi la thanh vien Stellaron Hunter, Sam'. 5.06: noi 'khong, toi khong de co ay chet'. KHONG ghi Stelle biet gi ve nguoi o goc."
