#   流萤 = Firefly, 银狼 = Silver Wolf, 砂金 = Aventurine, 黄泉 = Acheron, 花火 = Sparkle, 萨姆 = Sam, 翡翠 = Jade, 波提欧 = Boothill, 米凯 = Micah, 梦主 = Dreammaster, 加拉赫 = Gallagher, 托帕 = Topaz.
