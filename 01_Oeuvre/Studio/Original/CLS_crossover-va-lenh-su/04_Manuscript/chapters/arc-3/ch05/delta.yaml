#   Phong: tay ao Sunday 'cham/dung' o ba cho - la PHAN UNG KHONG LOI; khong ai noi ten, doan ten, hay noi 'toi biet nguoi nay' => khong dua ai sang suspected_by.
#   Khong Dazai, Jason, Gotham, giong luoi; 候选 khong co.
#   known_by / unknown_to / suspected_by cua ba secret: khong doi.
#
# ===== Hook =====
#   h-nguoi-do: GIU partially_paid (mat - ch3 arc 3; ten - chua). Ch05 them hai bac VIEC LAM: (5.02) bao Jade 'ket qua den truoc' roi vao be mo; (5.06) goc phong cua Stelle, noi 「我也去」. KHONG them gi ve TEN hay mat. Chi them dong Tien do (sua tay, o cuoi file).
