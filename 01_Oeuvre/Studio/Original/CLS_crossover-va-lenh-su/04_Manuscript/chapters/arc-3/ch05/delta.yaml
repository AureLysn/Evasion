#   h-ung-vien-gia-toc, h-giong-khong-ten, h-ipc-muon-jason: KHONG cham.
#
# ===== Nguong =====
#   Nguong 2 (Dazai->Tsuna 2 : Tsuna->Dazai 1, arc-3-chot-01-11 #8): ch05 KHONG dem gi. Dazai, Jason khong xuat hien.
