      evidence: "「银狼挨在她旁边，啧了一声。」 · 「“【未成年】……”银狼嘟囔了一句，“我当时就该回嘴回得再狠一点。”」 · 「银狼的指头在什么硬东西上轻轻敲了一记。」 · 「墙上，银狼接着往下说：第二重里，萨姆在等。」"
