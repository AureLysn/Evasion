      evidence: "「“他一路都在发宝石。”丹恒说。」 · 「“他那时候管我叫……”丹恒开了口，没有说完。」 · 「“你这话，”丹恒说，“放在这里不太对。”」 · 「丹恒那边又吸了一口气。」"
