    firefly:
      state: "Phim 3.8 (canon HSR): tu nhan 'toi la thanh vien Stellaron Hunter, Sam' truoc Stelle, xin loi vi giau, muon di cung Stelle duoi ten Firefly. Phong: hit mot hoi ngan khi giap bac sang len; thi tham voi Stelle chuyen nham mat; cuoi mot tieng nhe (that); hoi tho nhe di khi ten 太一 vang len. Chuong KHONG noi ai trong phong biet hay doan gi ve Firefly - Sam la canon HSR, khong phai bi mat CLS."
      evidence: "「第三排传来一口短促的气，是流萤的，在银甲亮起来的那一刻。」 · 「“我是星核猎手，萨姆。”」 · 「流萤的声音压得很低，只说给她一个人：“你那时候真的闭眼了。”」 · 「第三排有人笑了一声，很轻，是流萤。知更鸟听得出，那一声是真的。」 · 「第三排静得很，流萤那里，连呼吸都放轻了。」"
