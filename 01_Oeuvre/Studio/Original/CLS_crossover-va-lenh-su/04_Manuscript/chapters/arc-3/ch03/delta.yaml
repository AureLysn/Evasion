#     - known_by: KHONG them ai. Ca phong THAY mat nhung khong ai biet ten / biet la ai (Robin: 「她不认得。」). Thay mat != biet bi mat.
#     - unknown_to: GIU nguyen (ca nguoi xem arc 3 o phong). Khong ai trong phong biet gi hon.
#     - suspected_by: KHONG doi. March hoi 「……会是他吗？」 la cau hoi ve CHUYEN KHAC (ung vien), khong ve danh tinh; khong ai tra loi, Sunday 「不认得」. Khong co trich dan "ai nghi la Tsuna" => khong them.
#     - reveal_planned: frontmatter la dict -> state_apply ghi vao muc "can sua tay". De xuat: chapter "ch3 arc 3 (guong mat; ten: chua dat)".
#   Dong ngoai le trong prose note (state_apply KHONG ghi duoc phan van xuoi - tien le giong-khong-ten-la-dazai dong "Gương mặt: cấm ở mọi arc trừ arc 2" nam trong muc "Được phép thể hiện thế nào", khong phai frontmatter):
