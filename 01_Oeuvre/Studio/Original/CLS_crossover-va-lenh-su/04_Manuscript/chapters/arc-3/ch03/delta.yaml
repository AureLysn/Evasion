#   Da kiem (so tung chu trong leak_terms 纲吉 · 泽田 · 彭格列 · 死气 · 大空 voi than chuong): 0 ket qua. Than chuong khong co ten, khong 天空, khong 火 canh nguoi do, khong cam / vang kim, khong nhan, khong gang.
#   Hai secret kia (giong-khong-ten-la-dazai, jason-da-chet-va-song-lai): KHONG cham. Chuong khong nhac Dazai, Jason, Gotham, giong luoi, 黑泥.
