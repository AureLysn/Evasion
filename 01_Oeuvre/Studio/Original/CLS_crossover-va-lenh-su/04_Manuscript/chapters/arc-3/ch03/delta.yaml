      evidence: "「瓦尔特镜片边缘那道裂纹又往前爬了一截，爬得比前两次都长。他没有抬手去扶。」 · 「“先往下看。”瓦尔特说。」 · 「瓦尔特朝他点了一下头，是对共事的人才有的点法。」 · 「他经过瓦尔特身边，把那只小白瓷壶放到瓦尔特手边，才往门口走。」 · 「瓦尔特低头看墙上坐在那个人身边的自己，手杖往地上磕了一下，不重。」"
    black-swan:
      state: "Phong va phim. Phim: len hinh, tu xung hoi tuong 忆者, 'nguoi toi dua ve'; tach Firefly khoi 'Tu vong', mo cua ve thuc; ke Sparkle va mong dang vo cho Himeko; di don Himeko, March ve thuc. Phong: nhin minh tren phim, gat dau mot cai voi March; khong noi gi ve 'ung vien' hay ve nguoi do; nhin cua dong, hai tay long tren goi, mot chu cung khong noi. KHONG ghi Black Swan biet nguoi do la ai hay giao keo voi Aventurine."
      evidence: "「黑天鹅看着墙上的自己，琥珀色的眼睛没有动，只朝三月七点了一下头，一下。」 · 「黑天鹅没有绕圈子。」 · 「黑天鹅看着那扇关上的门，两只手交叠在膝上，一个字也没有说。」 · 「“忆域迷因，‘死亡’。”她说」"
    silver-wolf:
      state: "Phong, form thuong. Ngon cai dung tren nut luc nghe 失熵症; sau cai chet cua Firefly tren phim cat may choi len goi, man hinh den; im suot canh nguoi do. KHONG ghi Soi Bac 'biet' / 'nghi' gi."
      evidence: "「银狼的按键声停了。」 · 「银狼的拇指在按键上停了一拍。」 · 「银狼把掌机放到腿上，屏幕黑着。」"
    dahlia:
      state: "Phong. Hang cuoi, im lang, khong phan ung voi gi tren phim, ke ca guong mat va nguoi Gia toc o cua. Khong noi gi."
      evidence: "「最后一排，戴帽子的女士一动不动。」"

  relationships:
    # Khong doi con so. Ghi nhan cho nguoi viet tu cap nhat prose.
    nguoi-do-welt:
      note: "Tren phim (phong khach san thuc): nguoi do ngoi ben phai Welt, Welt gat dau 'danh cho nguoi lam chung', doi xu nhu dong nghiep; sau khi nguoi do di, nguoi do dat am ben tay Welt. Khong ten, khong giai thich. Ca phong thay quan he nay."
      evidence: "「瓦尔特朝他点了一下头，是对共事的人才有的点法。」 · 「他经过瓦尔特身边，把那只小白瓷壶放到瓦尔特手边，才往门口走。」"
    nguoi-do-himeko-march:
      note: "Tren phim: nguoi do dua coc am cho Himeko (cam on, khong hoi them), ngoi xo dua coc cho March, noi 'Hay uong mot ngum'; nhu nguoi quen. March tren phim nhan coc. Phong: Himeko 'ben kia toi khong phong bi anh ta'. Ca phong thay quan he nay (khong ten)."
      evidence: "「姬子接过去，说了声“谢谢你”，没有多问一个字。」 · 「三月七伸出手，把杯子接了过去。」 · 「“……那边的我，没防着他。”」"
    nguoi-do-gia-toc:
      note: "Tren phim: nguoi Gia toc (khong ten, che do phuc chinh te) goi nguoi do bang 'ngai' (您) va bao Gia toc cac vi dang cho; nguoi do khoac ao, noi 'Toi di'. Nguoi tren phim khong goi nguoi do la ung vien; chu 候选人 chi o phong."
      evidence: "「“家族的诸位在等您。”」 · 「“我去。”他说。」 · 「“他们对他说‘您’。”星指着门」"
    robin-sunday:
      note: "Anh em. Ch03: Sunday dich tay ve phia Robin nua tac khi Sparkle hien hinh, khong cham; Robin hoi 'anh co nhan ra anh ta?', Sunday 'khong nhan ra', 'nguoi tren tuong thi nhan ra'. Khong ai noi them. Robin van chua noi vi sao dem do re (coc nuoc ch02); khong hoi them."
      evidence: "「他搁在手帕旁边的手往她那边挪了半寸，没有碰她。」 · 「“哥哥，”她轻声问，“你认得他吗？”」 · 「“墙上那个人，认得。”」"
    stelle-firefly:
      note: "Phim: chup anh chung, hai vai sat nhau; bong bong tren tay Stelle. Phong: Stelle nam tay ao Firefly khong chat khong long, Firefly de yen; 'toi cung nho' ve tam anh; tay Stelle ben canh tay Firefly khong cham. P2."
      evidence: "「“茄子。”流萤轻轻说。」 · 「“我也记得。”星说。」 · 「流萤没有抽开。」"

