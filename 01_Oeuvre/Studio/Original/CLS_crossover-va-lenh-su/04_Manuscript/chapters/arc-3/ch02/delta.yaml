      state: "Phong: nghe giong cau dai cua nguoi ngoai khung 'lau hon do dai cau'; tay phai mo ra, rut thanh nam dam, khong noi gi. Xem chinh minh tren phim doa vui voi nguoi ban, giong long: ngoi thang len mot doan, tay vuon toi khan tay, cham roi buong. Dat mot ban tay len tay vin giua hai ghe, canh khan tay (khong nhin Robin, khong lap tieng). Cuoi: hoi Robin nguoi truoc tren tuong dua cho cau cai gi; Robin 'noi do hong'; Sunday: dem do anh khong dua (giong phang). Khong bi kich hoa: mot cau, phim chay tiep. Phim: dung giua, noi chuyen voi nguoi ben phai, tu nhan 'thoi quen nghe nghiep' (职业习惯), cuoi mot tieng ngan roi ep mieng; noi 'di thoi' voi nguoi ben phai. Chuong KHONG cho Sunday goi ten nguoi ban, KHONG ghi Sunday 'nho' ai; chi 'da thay tren phim'."
