      evidence: "「知更鸟先听见的是流萤。」 · 「知更鸟回过头。」 · 「她转回来，面对墙。」 · 「墙上的池水里，气泡一个一个往上冒，间隔均匀，正是四分音符的速度。知更鸟数。」 · 「知更鸟听着墙上那把嗓子。音色是哥哥的，一分不差，只是每句话收尾的地方，哥哥会停半拍，这一个不停。」 · 「她抬手，用手背碰了一下自己的脸颊，只一下，放回膝头。」 · 「这一段，知更鸟是头一回看。那一夜之后的事，她一件也没听说过。」 · 「知更鸟笑了。只有一声，很短，从鼻子里出来的。」 · 「那座沙盘摆放的位置，她认得，哥哥每天早上睁开眼，头一眼看见的就是它。」 · 「那句【做不到】，知更鸟是头一个听出来的。」 · 「她把这一行读了两遍。口气，收尾的那个“了”，她都认得。她侧过头，看了哥哥一眼。」 · 「知更鸟没有应。她把手放到膝头，数了一拍。」"
