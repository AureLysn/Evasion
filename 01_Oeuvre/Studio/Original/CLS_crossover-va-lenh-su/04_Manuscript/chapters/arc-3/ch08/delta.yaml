#   h-nguoi-do: GIU partially_paid (mat - ch3 arc 3; ten - chua). Bac moi tren phim: (1) lan dau gap THAT Jade + Oti (khong qua hinh chieu), ngoi ghe sau phia Gia toc, giu chu 「保管」, khong noi thay ai; (2) trao lien kia cua to giay cho Jade; (3) lan dau de lai mot la thu chuc mung khong ky ten cho Firefly (la thu, noi dung: phien dat); Robin thay net chu giong to 当票, khong noi. Khong ten. Them dong Tien do (sua tay).
