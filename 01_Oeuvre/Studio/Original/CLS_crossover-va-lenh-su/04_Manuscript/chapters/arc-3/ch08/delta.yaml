      evidence: "「身边的星期日坐得很直，两只手放在膝上，指节也没有动。」 · 「身边的星期日下巴抬了一点，脸朝着墙，一直没有移开。他呼出一口气，短短的，呼完才发出声音，轻得只有她听得见：“……她也这么说。”」"
    stelle:
