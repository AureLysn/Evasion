#   Chuong KHONG cho thay bat ky viec go nao. Phim chi cho thay: Firefly hoi 「是凉的吗」 dau canh, sau mot khuc nhac 「凉的」; khong ai noi vi sao, khong noi toi nguoi do. Delta chi ghi dieu do ben trong characters.firefly (dieu chuong cho thay). Viec go la su that tac gia, KHONG len trang, KHONG vao known_by / suspected_by cua ai - xem bookkeeping.
