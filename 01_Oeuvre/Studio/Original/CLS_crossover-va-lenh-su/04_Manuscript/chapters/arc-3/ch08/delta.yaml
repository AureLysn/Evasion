      evidence: "「流萤在门口站住。她看了一会儿，没有往里走，把脚收回来，往走廊那头去了。」 · 「“……她看见我了？”星的声音有点发虚。」 · 「星脚下一空，人被推出了栏杆。」"
    firefly:
      state: "Phim 8.01: cung Soi Bac o goc mo, noi 「往后的路，我想照自己的意思走。」 Phim 8.02: mot minh len tau, hoi duong Robin, thay Stelle tu xa khong lai gan, tiem 慈玉典押: Jade tu choi vi khong co gi ngang gia, noi Cong ty chua duoc benh voi gia lon. Phim 8.03: mot minh o duoi tau; tay an lan can, hoi 「……是凉的吗。」; tay cham la thu gap doi khong ky ten, doc hai lan, cat vao tui ao; sau mot khuc nhac, chong tay dung day: 「……凉的。」; tin nhan khong ten tren thiet bi, di theo huong nguoc dai le. Phim 8.04: tu goi 「第三次的头一步」 truoc qua bom, tu chon mang bom xuong nguyen so, thuc giap bay; phao hoa tu no, do duoc Stelle. Phong: hoi Robin doan bi bo; noi voi Stelle 「你问了。」 Chuong khong noi Firefly biet ai viet la thu, khong noi vi sao lan can lanh."
      evidence: "「“往后的路，我想照自己的意思走。”」 · 「“您身上带着的那个病，公司倒是治得了。只是价钱不低，很不低。”」 · 「“……是凉的吗。”她对自己说。」 · 「她照着原来的折痕把纸折好，放进外衣的口袋，隔着布按了一下。」 · 「“……凉的。”」 · 「手腕上的设备亮了：一条消息，没有署名。」 · 「那么眼下站在这里的，大概就是第三次的头一步。」 · 「“我穿着萨姆。”流萤说，“它够快，来得及。说不定，我还能回来。”她顿了顿，“这是我自己挑的。”」 · 「第三排传来流萤自己的声音，低低的，朝着星的方向：“你问了。”」"
    march-7th:
      state: "Phong. Phan nan may quay bo bai phat bieu cua Robin; hoi ai viet la thu (khong ai dap); hoi bua tren tuong con nhay so khong; reo khi Himeko thanh doc lap董事."
      evidence: "「“诶，镜头怎么跑了！知更鸟小姐还在讲呢！”三月七喊。」 · 「“谁写的呀……”三月七小声嘀咕。」 · 「“那个娃娃上的数，还在跳吗？”三月七问，椅子往前挪了半寸，吱的一声。」"
    himeko:
      state: "Phim 8.01: vao ban, Doan tau nhan 5% va co lam doc lap董事 (cam ket: dung de ai lam lech con duong lan nua). Phong: keo nhip 「后半场才是正题。」; noi se pha them ca phe khi hop."
      evidence: "「翡翠说，公司愿意从三成里分出百分之五，送给她的列车，再请她来做独立董事。」 · 「“后半场才是正题。”姬子说。」 · 「“开会的时候，咖啡我得多备一些。”姬子说。」"
    welt:
      state: "Phong. 「船要开了。」 (8.01); kinh: vet nut keu them mot tieng o 8.04 (khong ai dem)."
      evidence: "「“船要开了。”瓦尔特说。」 · 「后头，瓦尔特那边，镜片又细细地响了一声，是那道老裂在往前走。」"
