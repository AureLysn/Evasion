  characters:
    robin:
      state: "Phong, POV, hang dau canh Sunday. Khong quay lai lan nao; moi nguoi phia sau chi la am thanh. Nhan ra con pho Lieu Mong Tieu (noi co day tre hat). Nghe bien danh 「黑泥」 tu sau lung, khong hieu, khong hoi; chua xem arc 2 nen cau Sunday 'la ben nay' la cau chua hieu het - giu trong tai, khong hoi, khong doan. Nghe cuoi cau 「我去拦住他」 roi. KHONG biet giong o xa la ai. Khong noi ve cai chet cua minh."
      evidence: "「“……是那条街。”知更鸟说得很轻，几乎是对着自己。」 · 「知更鸟没有听过三月七喊的那个叫法。她没有回头去问。」 · 「知更鸟没有听懂。“一直”是多久，哪一边，她没有看过前面那几场。她把这句话留在耳朵里，没有问，也没有往下猜。」"
    sunday:
      state: "Phong. 6.01: lung tua han vao ghe khi giac mo cua ban kia vo, khong mot chu bien ho. 6.04: ngoi thang khi nghe nguoi do dinh dung yen chiu don cua ban; tay phai nam chat. Cuoi: noi nho 'hoa ra nguoi luon noi khong sao la ben nay' - noi cuoc goi voi cuoc goi arc 2, khong goi ten, khong doan ten."
      evidence: "「他放在膝上的手摊开了，没有攥，也没有话。墙上裂开的是另一个星期日织出来的梦，他一个字也没有替它争。」 · 「她看见身边的星期日坐直了。背离开椅背，下巴抬起来，朝着墙，放在膝上的右手一点一点收紧，攥住了。」 · 「“……原来一直说没事的，是这一边。”」"
    stelle:
      state: "Phong va phim. Phim: nham mat khi Acheron chem; mo mat khi mua sao roi; hoi Acheron 「流萤的愿望呢？」 o mep 虚无. Phong: gia 'dem so den' ve Boothill; sau 'Firefly roi vao khe' thi ghe nghieng ve phia Firefly, khong hoi, khong noi; nhan ra giong o xa 'lan nay tuong cho ben kia'."
      evidence: "「星睁开了眼睛。星雨还在落。」 · 「“……这回墙给的是另一边。”星说。」 · 「星没有说话。知更鸟听见她的椅子朝流萤那边偏过去，衣料窸窣一阵，然后停住，偏着，没有再动。」"
    firefly:
      state: "Phim: o mep cai chet, tra loi ba cau hoi 'tu truoc / bay gio / sau nay' (Grammer Iron Cavalry / Stellaron Hunter / 'mot co gai binh thuong'), khong buoc qua; thang 深魇蝗灾, lay 星核, xe khe o 原始梦境 va roi vao 太一之梦 (cai chet thu hai). Phong: nghe chinh minh noi 「平凡」 - im, chi mot tieng vai ao ghe; sau khi roi, khong tra loi Stelle. 6.04 khong mot phan ung. Chuong KHONG noi ai biet gi ve Firefly ngoai nhung gi phim da chieu."
      evidence: "「“星核猎手。”」 · 「隔了一拍。流萤的声音很小，没有抖：“……一个平凡的女孩子。”」 · 「流萤抬起头。“不。”她说，“我是一路拼着命走到这儿的，路还没走完。”」 · 「知更鸟听见第三排的衣料在椅背上蹭了一下，只一下，是流萤。」 · 「流萤没有答，银狼也没有敲。」"
    silver-wolf:
      state: "Phong. Noi ve bong cua minh tren phim: 'mieng nhanh qua'; 'Ban doan di' (khong tra loi them). Ngon tay go khi Firefly danh (dem nhip), dung khi Firefly roi, khong noi tro lai. 6.04: dua ve tin hieu ('trong mong con goi ra duoc'). Khong biet bien danh. Chua ghi gi ve viec Soi Bac 'da xem kich ban' toi dau."
      evidence: "「“墙上那个我，嘴也太快了。人家问输了怎么办，张口就答，答得跟真的一样。”」 · 「“你猜。”银狼说，“墙上这位还没说完。”」 · 「“梦里还能打出去？”银狼说，“信号挺好。”」 · 「银狼那边没有声音，扶手上也没再响。」"
    march-7th:
      state: "Phong. Nhan ra 'den trang' tu 5.01; khen Firefly nho; nhan ra giong o xa bang bien danh do Stelle dat: 「是黑泥！」; nhan xet giong va thoi quen tat may giong lan truoc. Phat hien nut kinh Welt ('lan thu sau'). Khong ai noi ten giong."
      evidence: "「“又是黑白的……”三月七的声音从后头冒出来」 · 「“是黑泥！”三月七的声音一下子顶了上来，顶得太高，自己吓了一跳。」 · 「“这个声音，”三月七压着嗓子，“跟上回墙里那个，一个调。”」 · 「“又长了一截！”三月七压着嗓子，“这是第六回了。”」"
    dan-heng:
      state: "Phong. Ghi nhan thoi quen dem cua giong o xa: 'Anh ta lai dang dem'; 'noi xong la cup may'. Van chi o suspected_by, khong hon. Khong goi ten."
      evidence: "「“他又在数。”丹恒说。」 · 「“话一说完就挂，”丹恒说，“也是一个样。”」"
    himeko:
      state: "Phong. Keo nhip bang cau ngan: 'Van dang nut' (6.01), 'Chua xong' (trong tran), goi 'Stelle' mot tieng khi cuoc goi tien toi 'dung yen'. Khong noi gi them."
      evidence: "「“还在裂。”姬子说，椅子往前挪了半寸。」 · 「“还没完。”姬子说。」 · 「“星。”姬子叫了一声。」"
    welt:
      state: "Phong. Vet nut kinh dai them lan thu sau (6.03, 'Khong sao'); noi 'Vet ran dang lon' (6.03) va 'Nghe' (6.04). Khong noi gi ve giong o xa."
      evidence: "「“不碍事。”瓦尔特说。那边轻轻一声，镜架落回了原处。」 · 「“口子在变大。”瓦尔特没有接她的话，说的是墙上。」 · 「“听。”瓦尔特说。」"

