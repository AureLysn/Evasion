# Cho can Aurel quyet danh dau "AUREL (n)"; moi muc co MAC DINH an toan. Aurel chua tra loi = chua ap mac dinh. Khong muc nao chan.
# Khoa "chapter" = a3-ch06 (khuon ch01-ch05).
#
# ===== Bi mat: KHONG dung secrets/ (changes.secrets de trong) =====
#   Giong o xa (6.04) KHONG ten, KHONG mat; phong chi noi theo giong va bien danh do Stelle dat tren phim: 「是黑泥！」 (March). Khong ai noi ten, noi la ai, hay noi o dau.
#   Dan Heng: 「他又在数。」 - chi noi thoi quen dem; da o suspected_by tu truoc, khong len muc moi, khong ai khac nghi them.
#   Sunday: 「……原来一直说没事的，是这一边。」 - noi giong voi giong (cuoc goi arc 2 ch03), khong goi ten, khong doan ten => khong doi known_by/suspected_by.
#   Robin, Firefly, Soi Bac, Dahlia: nghe giong lan dau, khong hieu, khong hoi (Robin: 「知更鸟没有听过三月七喊的那个叫法。她没有回头去问。」) => giu unknown_to. Firefly, Dahlia khong noi gi.
#   Black Swan khong phan ung o khoi cuoc goi. Ba secret (nguoi-do-la-tsuna, giong-khong-ten-la-dazai, jason-da-chet-va-song-lai): known_by / unknown_to / suspected_by khong doi.
#
# ===== Hook =====
#   h-giong-khong-ten: GIU open (payoff khong doi; ten, the gioi cu, di nang chua tra). Them dong Tien do (sua tay).
#   h-nguoi-do: GIU partially_paid (mat - ch3 arc 3; ten - chua). Bac moi: lan dau thay BEN NAY cua mot cuoc goi; thoi quen 「没事」 duoc noi ra tren phim; nguoi do TU noi 「我去拦住他」 (y dinh, chua co cach lam). Them dong Tien do (sua tay).
#   h-ung-vien-gia-toc, h-ipc-muon-jason: KHONG cham.
#
# ===== Nguong 2 (Dazai->Tsuna 2 : Tsuna->Dazai 1, arc-3-chot-01-11 #8) =====
#   Cuoc goi ch06: giong ghi lai va noi ra ba lan nguoi do lui (「第一个」「第二个」「第三个」) va hoi vong cho toi khi nguoi do TU quyet chan => giai quyet ho => Dazai->Tsuna +1 (arc 2 ch03 = 1, arc 3 ch06 = 2). Tsuna->Dazai = 1 (arc 2 ch09). => 2 : 1, CHAM TRAN. Chi vao relationships/tsuna--dazai-cls.md (sua tay, cuoi file).
#   Khong co viec nguoi do lam ho giong (「吵醒你了？」 la hoi tham). Giong khong ra lenh: nguoi do TU noi.
#
# Quy uoc ten: 知更鸟 = Robin, 星期日 = Sunday, 星 = Stelle, 三月七 = March 7th, 丹恒 = Dan Heng, 姬子 = Himeko, 瓦尔特 = Welt, 流萤 = Firefly, 银狼 = Silver Wolf, 黄泉 = Acheron, 波提欧 = Boothill, 深魇蝗灾 = Swarm Nightmare.
# Tinh huong khung: phong chieu (POV Robin), giu cho ngoi, 11 nguoi. 6.01 nhat dao cua Acheron, chinh ngo cua 太一之梦 nut, Boothill ban phat dau, mua sao. 6.02 mep 虚无, bong Soi Bac, Firefly ba cau hoi, khong buoc qua, 深魇蝗灾, tran.
#   6.03 thang, lay 星核, xe khe o 原始梦境, roi (cai chet thu hai). 6.04 (PHIEN DAT) nguoi do goi mot giong o xa o Lieu Mong Tieu; hoi vong; nguoi do TU noi chan; Sunday 'la ben nay'.
# Nhan: 6.04 (toan bo cuoc goi) + cac cau trong phong + mot so cau dien y cua Firefly = PHIEN DAT / DE XUAT (khong canon).

