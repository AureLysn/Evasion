      # (phim, 6.04) Dem: 「“第一个。”」 · 「“第二个。”」 · 「“第三个。我记着呢。”」 · giong tu tat: 「那一点光自己灭了，是那头先挂的。纸响也停了。」
      # (phong) 「“是黑泥！”三月七的声音一下子顶了上来」 (bien danh do Stelle dat tren phim) · 「“……这回墙给的是另一边。”星说。」 · 「“他又在数。”丹恒说。」
