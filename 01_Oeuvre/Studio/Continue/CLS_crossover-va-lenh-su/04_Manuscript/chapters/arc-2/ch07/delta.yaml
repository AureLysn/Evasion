      evidence: "「“那刻夏和赛飞儿合计出一个办法，把来古士封死在创世涡心。赛飞儿当诱饵，一去不回。封他的术法，烧的是那刻夏的命。”」 · 「兜帽走进涡心。一只脚抬起来，还没有落下，画面切断。」"
