      evidence: "「小个子一见星，迈着小碎步跑过来，行了个礼，一板一眼。」 · 「“原来您是这个样子的！”」 · 「墙上的缇宝对星鞠了一躬，又对昔涟鞠了一躬，一个字也没多问。」"
