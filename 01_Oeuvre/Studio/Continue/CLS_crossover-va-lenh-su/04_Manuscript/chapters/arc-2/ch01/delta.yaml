    phainon:
      # Chua co note project (xem new_entities). POV phong. Canon tu MAIN-DATABASE khong co ghi chu Phainon; ngoai hinh theo Amphoreus-npc-ngoai-hinh.
      state: "Phong chieu, POV. Buoc ra tu suong (bang cuoc cua cua tuong), khong biet minh toi bang cach nao; ky uc gan nhat: ban tren Doan tau va mot trang giay day chu. Khong tim hieu them, khong giai thich. Khong ai noi anh la ai / anh dang o trang thai nao sau 3.7. Khong xem arc 1; khong biet Jason, khong biet giong IPC Wolf. Tren phim (Phainon thoi dau, tu nhin lai): nhay tu xa nha xuong giua dam quai, muon cay gay cua Stelle de danh gay thuong cua Dan Heng, bi Tribbie bat xin loi (Tribbie goi 「小白」). Trong phong: cui chao Stelle ve cay gay (「规规矩矩地鞠了一躬」), noi dua 「棒子的账记在我头上」. Quan sat Okhema trong dau, tim 「缝」 (cho thanh pho co them mot khoang anh khong biet) khi thay bong lung: 「我不认识。起码，我没见过这个人。」 Cuoi chuong: thay Dan Heng va Himeko doi tu the, khong biet ho nghe gi, khong hoi."
      evidence: "「灯亮的时候，白厄正站在一间没有窗的屋子里。」 · 「他最后记得的，是列车上的一张桌子，和一页写满了字的纸。再往后是什么，他想不起来，也没有去追。」 · 「“上一刻我还在你们的车上，对着一页纸发愁。下一刻就在一面墙里头。」 · 「白厄站起来，朝着球棒，也朝着球棒的主人，规规矩矩地鞠了一躬。」 · 「“我不认识。”他说，“起码，我没见过这个人。”」 · 「这回他换了个法子，不找人，找缝：他的城里，哪一处多出了一块他不知道的地方。」 · 「他不知道这两个人听见了什么，他只听见一个闲人，在一个收了摊的货摊底下，对星说了一句废话。他没有问。」"
    black-swan:
      # Chua co note project (xem new_entities). Ngoai hinh theo Amphoreus-npc-ngoai-hinh.
      state: "Phong chieu. Buoc ra tu suong cung Phainon va Screwllum, la nguoi dau tien chu dong chi duong (「走吧。站在门口的人，最容易被当成路过。」). Goi Sunday bang ten truoc tien, ngay luc bat dau. Tren phim: tu tay lay guong tron, hien ra the gioi hinh so 8, noi 「这是我的一点私心，各位若是不愿意，我不会勉强。」 (nhin chinh minh de nghi di Amphoreus). Nhan xet nhip phong: 「原来我提这件事的时候，是这副表情。」 / 「很有把握的那一副。看得人替她捏一把汗。」 Khong nhac Dem Dai, khong noi ai moi ai toi (soat N1)."
      evidence: "「“走吧。站在门口的人，最容易被当成路过。”」 · 「“星期日先生。”黑天鹅走到最前头，对着那位银灰头发的青年点了点头。」 · 「“这是我的一点私心，”她说，“各位若是不愿意，我不会勉强。”」 · 「“原来我提这件事的时候，”黑天鹅看着墙，“是这副表情。”」 · 「“很有把握的那一副。”她说，“看得人替她捏一把汗。”」"
    screwllum:
      # Chua co note project (xem new_entities). Ngoai hinh theo Amphoreus-npc-ngoai-hinh.
      state: "Phong chieu. Buoc ra tu suong cung Phainon va Black Swan. Noi theo kieu 「结论：… 逻辑：…」 (giong 'banh rang'). Quen Welt tu truoc: 「结论：上次共事时，你的眼镜是完好的。」 Welt: 「进了这间屋子才有的。」 Nhan xet kieu 'ket luan' ve mu Pom-Pom (cao hon quy dinh 40%) va thanh Okhema (「墙上有洞」). Phainon khong noi quen Screwllum — Screwllum goi Welt truoc."
      evidence: "「“结论：这里不是任何一个已知的地方。”金属脑袋的人说，声音像齿轮碾过齿轮，一板一眼，“逻辑：我没来过。”」 · 「“瓦尔特·杨。”金属脑袋的人说，“结论：上次共事时，你的眼镜是完好的。”」 · 「“结论：帕姆的帽子，”螺丝咕姆说，“高度超出列车长规范的百分之四十。”」 · 「“结论：这座城防御不足。逻辑：墙上有洞。”」"
    boothill:
      state: "Phong chieu. Dung o cua, la nguoi dau tien len tieng khi ba nguoi moi buoc ra tu suong: noi nhu chu nha tiep khach. Noi voi Stelle: 「出去问个人。这边你们自己看着办。」 — Stelle xin di cung — 「你的活儿在这儿。它要演什么，总得有人看。」 Cham mu mu, doi cua, ra. Goi Stelle la 「球棒宝贝」. Khong neu ten ai, khong neu Jason, khong neu IPC. Cua dong lai khong ra tieng."
      evidence: "「“新客人，”他说，“一来就是三位。这屋子今天专收没请自来的。”」 · 「“球棒宝贝，”戴牛仔帽的人朝灰发姑娘抬了抬下巴，“把家伙放下，人家比你还懵。”」 · 「“出去问个人。这边你们自己看着办。”」 · 「“你的活儿在这儿。”那人伸手指了指结霜的墙，“它要演什么，总得有人看。”」 · 「戴牛仔帽的人碰了碰帽檐，推门出去，门在他身后合上，没有响。」"
    stelle:
      state: "Phong chieu. Cam gay thang, hai lan ha xuong roi nang len (「放到一半，又举回去」); xin di cung Boothill, bi tu choi, lui ve cho cu, roi ngoi xuong sau khi cua dong. 「我们也是，进来之后就这样了。」 Noi voi Phainon 「现在有了」 (ghe canh). Doi mot loi xin loi cho cay gay bi lom: 「你欠我一个。」 — 「这回我要看你自己来。」 Giua nhip phong, sau canh to vang: 「我记得这个约定。」 (chi cau do; March nhin, khong hoi). Tren phim (sau tam to vang): ngon tay con cong nhu dang cham mot soi day khong con o do; bi mot giong la goi o bac da — quay lai hoi 「谁？」 Khong phan ung tren phong khi giong vang len."
      evidence: "「灰发姑娘没放，嘴上倒是接得快：“你去哪儿？”」 · 「“我也去。”」 · 「灰发姑娘僵了一会儿，又退回原处，球棒仍旧横在身前。」 · 「“现在有了。”星说。」 · 「“你欠我一个。”她学着缇宝的腔调」 · 「“那会儿是被按着头道的。”星说，“这回我要看你自己来。”」 · 「“我记得这个约定。”」 · 「她手指蜷了蜷，像是在摸一根不在那里的线。」 · 「星站住了。她回头：“谁？”」"
    march-7th:
      state: "Phong chieu. Chup mot buc anh dau tien khi Phainon buoc vao (flash), roi 「有温度！」 / 「是真的！星，他是真的！」, chong Phainon bang ngon tay. Nhan ra Black Swan: 「你也在这儿？」 Keo ghe cho Black Swan. Tren phim: ngan ngua Pom-Pom (「你上次说快见底，是三个星期以前」), ngat, duoc dua vao khoang nghi — khong tham gia chuyen xuong Amphoreus. Cuoi: nhin Stelle nhac 「我记得这个约定」, nhin buc tuong, khong hoi tiep."
      evidence: "「她的相机终于按了下去。咔嚓一声，闪光灯把白厄的眼睛晃得发花。」 · 「“有温度！”三月七凑上来，伸手戳了戳他的披风，又戳了戳他的肩，“是真的！星，他是真的！”」 · 「“黑天鹅？”三月七越过他的肩膀，眼睛一下子睁圆了，“你也在这儿？”」 · 「三月七被送进了卧厢。」 · 「三月七看了看她，又看了看墙，没有追问。」"
    dan-heng:
      state: "Phong chieu. Dung thang, dung cach Phainon mot canh tay: 「丹恒什么也没说。他往前走了两步，停在离白厄一臂远的地方，站住了。」 Nhip phong: 「落地比我记得的响。」 (cau dau tien cua anh trong chuong.) Tren phim: bi Phainon lam gay can thuong; keo Stelle ra khoi toa, tay treo tren mat Stelle lau hon can thiet. Khong cuoi khi Phainon xin loi; khong nhin lai khi Stelle nhin. Cuoi chuong: 「丹恒坐直了，脊背离开了椅背。」 — chi cu chi, khong noi ve giong."
      evidence: "「丹恒什么也没说。他往前走了两步，停在离白厄一臂远的地方，站住了。」 · 「“落地比我记得的响。”丹恒说。」 · 「一只手悬在她的脸侧，悬得比需要的久。」 · 「丹恒没有笑。…丹恒没有回望。」 · 「丹恒坐直了，脊背离开了椅背。」"
