      evidence: "「“白厄。”她说，“先不问你怎么来的，我们也没有答案。能见到你，我很高兴。别的，坐下再说。”」 · 「姬子把杯子往扶手上一搁：“先看。”」 · 「姬子端着杯子：“后面还有。”」 · 「姬子把杯子放回扶手，放得很慢，一点声音也没有碰出来。」"
