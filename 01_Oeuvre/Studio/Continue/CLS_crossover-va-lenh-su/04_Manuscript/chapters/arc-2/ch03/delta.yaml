      state: "Phim (Okhema, lan hai o arc 2). Hoi Hyacine ve thuoc ngu 「喝下去就睡，睡着了，就不用再起来的」 + 「要不疼的」; Hyacine tra loi 'thuoc ngu = ngu' va dat 「小病号」. Hoi ten: 「在这儿用不上。我也不是病人」. Hyacine doc ra: thieu ngu >= 3 ngay, chi an mut, chi trong may nguoi nuoi mut. Bi giu lai quat lo thuoc, an chao; noi nho: 「我认识的一个人」 / 「看不得别人没吃饭」; hoi 'nguoi do o dau': 「很远」. O Anh hung duc tri chi tho tay thu nuoc roi ngat vi hoi nong (khong ngam). Noi voi Mydei: 「死不怕」 / 「疼才怕」 / 「烫就是疼」; khong ai hoi ten. Tien Mydei roi Okhema: 「路上小心」. Dem ve, trong quan nho, nghe hop den: hoi vong 3 cau, noi 「别认」, bao nguoi kia di tim mot nguoi hoi mot cau, tu choi cam on: 「不是我的」. Ngoai hinh khong doi: toc nau roi, mi nua dong, ao khoac ngan xam xanh, so bia khong chu."
      evidence: "「“请问，”他说，“这里有没有那种药？喝下去就睡，睡着了，就不用再起来的。”顿了顿，他补一句，“要不疼的。”」 · 「“名字啊，”他对着帘子顶说，“在这儿用不上。我也不是病人。”」 · 「“……跟我认识的一个人一样。”他说得很轻，轻得更像是对碗讲的，“看不得别人没吃饭。”」 · 「“很远。”这一句他答得很快。」 · 「他躺下去的时候，手还知道先把册子护在胸口。」 · 「“死不怕。”他说，“疼才怕。烫就是疼。”」 · 「“路上小心。”」 · 「“那我替你说一遍。”他说，“路上小心。”」 · 「“你是想问我怎么办。”」 · 「“别认。”他说，只有这两个字，不加理由。」 · 「“不是我的。”他说。顿了顿，“路是你自己走过去的。”」"
