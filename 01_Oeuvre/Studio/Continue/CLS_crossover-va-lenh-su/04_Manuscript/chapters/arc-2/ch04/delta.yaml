# Quy uoc ten: 白厄 = Phainon, 星 = Stelle, 三月七 = March 7th, 丹恒 = Dan Heng, 姬子 = Himeko, 瓦尔特 = Welt, 黑天鹅 = Black Swan, 螺丝咕姆 = Screwllum, 星期日 = Sunday,
