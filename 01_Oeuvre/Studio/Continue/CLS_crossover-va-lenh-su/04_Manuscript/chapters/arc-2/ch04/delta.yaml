  characters:
    phainon:
      state: "Phong chieu, POV. Cuoi to hon du tinh cung ca phong o 4.02, loi ke khong tach anh ra. Biet ngay Aglaea mat, noi mot cau ve Aglaea (「她不喜欢别人动她的线。」) roi im. Khi tren phim nguoi la dem cac bong ao den, ngon tay anh tren dau goi go theo tung cai; dung lai cung luc ngon tay tren phim dung. Khong ai thay, loi ke khong giai. Cuoi chuong nhin dang ngoi tren phim toi dan toi khi tat."
      evidence: "「白厄笑出了声。那声音比他预想的响，他抬手去捂，已经晚了，肩膀抖了好几下。」 · 「白厄认得那个方向通向哪里，也认得今天是哪一天。」 · 「“她不喜欢别人动她的线。”他说，声音不高，说完就把嘴闭上了。」 · 「白厄的食指搭在膝盖上，跟着墙上那根手指，一下，一下，从左到右。」 · 「墙上的手指停住的那一刻，白厄膝盖上的食指也停了。」 · 「白厄看着那个轮廓，直到它也暗了。」"
    stelle:
      state: "Phong chieu. Tra loi March ve cho trong giua hang: 「少了一个。」 Biet Cipher tu truoc (「她也顺过我的东西」). Tren phim cung Cipher toi Styxia, bi doa boi bong ao den, cay bong run; phong choc, Stelle cham 「战术性后退」, quay mat nhin tuong. Im lang tu luc dong xu roi vao cat toi khi man cau vong len: phan ung duy nhat cua phong voi chuyen Cipher."
      evidence: "「“少了一个。”星说，眼睛没离开画面。」 · 「“赛飞儿。”星说，“她也顺过我的东西。”」 · 「“……战术性后退。”星把脸转向墙，不看任何人。」 · 「星一个字也没有说。从那枚硬币落进沙里，到那面彩虹色的幕升起来，她没有出过一点声。」"
    march-7th:
      state: "Phong chieu. Hoi 「是留给谁的？」 ve cho trong giua hang; ve nguoi la quay lung voi nha tam; hoi 「他是不是……早就知道了？」 (hoi tuong, khong hoi ai); hoi ngon tay dung o bong nao. Khong ai tra loi du; Himeko khong dap, March khong gang."
      evidence: "「“中间那块空的，”三月七指着墙，“是留给谁的？”」 · 「“他转过去干嘛？”三月七问。」 · 「“他是不是……早就知道了？”三月七的声音比刚才小了一圈」 · 「“他停在哪一个上面？”三月七问，“为什么停？”」"
    dan-heng:
      state: "Phong chieu. Doc phim bang chi tiet: vet cao tren cua so, tam nhin chuyen sang nguoi la, cai ghe ngoi quay lung. Tren phim: cung Hyacine toi thanh tren may, roi chan hau cho nhom chay (「你们走。」); trong phong noi minh nho dai hon (「我记得的比这个长」), khong tra loi cau March hoi co so khong."
      evidence: "「“爪痕是离开的时候划的。最长那一道，故意拖向城门。”」 · 「“那个岗亭是空的。”丹恒说，“画面是顺着他的视线过去的。”」 · 「“你们走。”」 · 「“那一段，”丹恒看着墙，“我记得的比这个长。”」 · 「丹恒没有答，视线从墙上移开了一瞬，又移了回去。」"
    himeko:
      state: "Phong chieu. Giu nhip: 「看」 / 「接着看」 / 「接着」; chan Stelle khi Caenis hien (「看完再说」); khong tra loi cau March hoi ve ngon tay dung."
      evidence: "「姬子把杯子端了起来：“看。”」 · 「“看完再说。”」 · 「“看完。”姬子又说了一遍，手没有松。」 · 「姬子端起杯子，喝了一口，没有回答。」"
    welt:
      state: "Phong chieu. Vet nut tren kinh dai them mot chut khi thanh Okhema tat den (D8), khong neu vi tri; khong ai hoi. Con lai: 「接着看」 / 「先看完」."
      evidence: "「瓦尔特伸手扶了一下眼镜腿。镜片上那道裂又往前爬了一截，爬到了哪里，他没说，屋里也没人问。」 · 「“先看完。”瓦尔特说。」"
    black-swan:
      state: "Phong chieu. Chi mot nhip cuoi chuong: nhin tuong khi tat, khong quay mat. Khong noi, khong lieu Phainon."
      evidence: "「黑天鹅看着墙，没有侧过脸。」"
    screwllum:
      state: "Phong chieu. Hai nhan xet ngan: tro dua cua Cipher (「结论：恶作剧。」 / 「逻辑：星和迷迷都信了。」) va nguoi la quay lung sau khi Aglaea di qua (「观察：他转过身以后，没有再回头。」). Chi neu viec, khong khen."
      evidence: "「“结论：恶作剧。”螺丝咕姆说，“逻辑：星和迷迷都信了。”」 · 「“观察：他转过身以后，没有再回头。”螺丝咕姆说。」"
    sunday:
      # Chua co note; khoa ky thuat neu co. AUREL (1) cung muc voi ch03.
      state: "Phong chieu. Sau Bartholos: nhac lai nua cau tren tuong (「比实话更对得起听的人」) roi dung, khong them. Khong ten ai."
      evidence: "「星期日看着墙，过了一会儿才开口，声音很平：“【比实话更对得起听的人。】”他把墙上那半句重复了一遍，就停住了，后面没有了。」"
    dazai:
      # Khoa ky thuat Characters/dazai.md. TREN TRANG khong ten: 「那人」/「他」. Cipher khong noi voi nguoi la cau nao (Đ-13).
      state: "Phim (Okhema, hang tap hoa). Ngoi tren hop go lat, banh mat tren goi; so bia trong, khong mo. Cipher tren man bat lay banh: nguoi la thay, khong cho, khong dau, khong noi. Cho Cipher di roi an tiep, xac nhan so con o nach. Ngay Aglaea mat: nhin len duong thua day vang, xoay hop quay lung ve nha tam, an tiep banh; khong goi, khong theo, khong quay lai. Khi tin chet toi: ngoi nguyen, nhin len khong con soi nao, gap goi banh lai. Dem tat den: vén bat, nhin man cau vong, khong can ai. Cuoi: dem cac bong ao den tren mai, tu trai sang phai hai luot, ngon tay dung o bong cham nua nhip; mat nhin theo, khong gi xay ra voi nguoi la. Ngoai hinh khong doi."
      evidence: "「那人坐在翻过来的木箱上，膝头放着下坡那家的一包蜜饼。册子夹在腋下，封面空白，没有翻开。」 · 「他捏着蜜饼停在半空，没有伸手去拦，没有抬头，也没有出声。」 · 「腋下的册子还在，他用胳膊肘按了按，确认过了」 · 「他站起来，把木箱拖了半圈，坐下时背朝着浴池。」 · 「他没有喊谁，没有跟上去，也没有回头。」 · 「他仰起头，头顶的金线，一根也没有了。」 · 「他伸手，把篷布掀开，卷到一边，抬头去看那面彩色的幕。」 · 「他抬起一根手指，从左边起，一个一个点过去。嘴唇没有动。」 · 「那根手指在那个影子上停住了。」 · 「什么也没有碰到他。」"
    cipher:
      # Nhan vat canon, chua co note project. Ngoai hinh o Amphoreus-npc-ngoai-hinh (da chep 26/10). C4: khong bi kich hoa trong state.
      state: "Phim. 赛飞儿 (con meo trom). Lay qua cua Castorice, de lai ba vet cao tren cua so keo ve cong thanh; lay goi banh mat cua nguoi la, can mot mieng, nhan mat vi dinh rang (「粘」), roi nhay di; hai nguoi khong trao loi. Dan Stelle + Castorice toi Styxia bang dong xu. Mang ao den doa Stelle + Mem, khoe quyen 诡计 va noi cau ve vai trong vo cua nguoi khac (hat 'cho trong phan dien'). Nhan giu lua Kephale cua Phainon, thu phi giu. Tu choi loi nhan cua Aglaea qua diem sang (「你的事，自己回来说！」). Hoa dang Phainon tren cat, tung dong xu; kiem nang len. Dong xu roi vao cat, khong ai bat. Cau cuoi: xin loi Aglaea, khong cau thu hai. Phim khong cho thay xac."
      evidence: "「她手一合，星和遐蝶脚下的石板没有了，换成一片灰白的沙地。」 · 「篷布边缘垂下一只手。黑色的手套，只露指尖，慢悠悠探到他膝头，把纸包勾了起来。」 · 「篷布上的人咬了一口，眉毛当场拧成一团」 · 「含含糊糊挤出一个字：“粘。”」 · 「“别人搭好的戏，总空着个角儿。谁站进去，有人信，谁就是那个角儿。你们刚才不也信了？”」 · 「她把面具往背后一塞，拍了拍手，“这就是诡计的神力。」 · 「“你的事，自己回来说！”」 · 「她的手在脸上一抹，猫耳和尾巴都不见了，斗篷也不见了。沙地上站着一个白头发的青年」 · 「硬币落了下来，落进沙里，没有手去接。」 · 「“对不起，阿格莱雅。”」 · 「没有第二句。」"
    aglaea:
      # C4: khong bi kich hoa, khong doc thoai, khong ai khoc. Mat o muc than chuong cho.
      state: "Phim. Duong thua day tho vang chi con 4 soi (bo cuc, Đ-3 de xuat). Mot minh toi nha tam, khong nhin ai. O nha tam: bao Caenis da toi luc buong tay, buong chi vang, khong nhin vao nhung con dao. Sau do tin: roi tu nha tam, tim bi dam. Thu viet de lai cho Phainon (gia yeu de ran lo nanh, nem hoa cuoi vao o). Gui diem sang bao Cipher ve Okhema va noi minh di xa. Khong liec nguoi la hang tap hoa."
      evidence: "「今天稀了，稀得能数出来：四根。」 · 「阿格莱雅从市集那头走过来，一个人。」 · 「她没有看路两边的任何人。」 · 「阿格莱雅走进来，站在水汽里，看了看那孩子，又看向凯妮斯。她说，到了该放手的时候了。」 · 「指尖上缠着的金线一圈一圈松开，落进水里，没有溅起水花。」 · 「阿格莱雅从黄金裔浴池坠了下来，心口被清洗者手里那种一模一样的匕首刺穿。」 · 「阿格莱雅写，她要让蛇群以为她已经站不稳，等它们急得露出牙，她再把最后一点火丢进窝里。」 · 「光点发出的是阿格莱雅的声音，请她回一趟奥赫玛，又说，自己要出一趟远门。」"
    castorice:
      state: "Phim. Xin toi Styxia cung Stelle, nhan duoc loi nhan cua Aglaea, di mot minh toi bo song, cuoi xuong long xuong de qua bo; noi se thay giu cua mot luc (khong noi o lai han). Dem Okhema tat den: dung canh Mydei chan mot con duong, tha buom."
      evidence: "「遐蝶站在阿格莱雅和白厄面前，说她想去斯缇科西亚，也想带星同行。」 · 「她要去对岸，替这里守一阵门」 · 「遐蝶站在他身边，荆棘冠垂着，紫色的裙边铺在石板上。」"
    caenis:
      # Canon NPC, chua co note. Ngoai hinh o Amphoreus-npc-ngoai-hinh (26/10).
      state: "Phim. 凯妮斯: dung trong nha tam, keo mot dua tre khong nghe thay truoc nguoi; tay siet chat khi Aglaea de nghi buong tay. Phim cat truoc luc dao ra tay."
      evidence: "「她叫凯妮斯。」 · 「凯妮斯的手收紧了，那孩子被带得往前踉跄一步，仍旧什么都听不见。」 · 「画面在匕首举起来之前切断。」"
    tribbie:
      state: "Phim. Dung ben Tinning o hang dau doan nguoi mac trang, giua co cho trong. Dua thu Aglaea cho Phainon, tay khong run. Dung truoc 百界门, mo cong cho nhom chay vao (theo TextMap, V3)."
      evidence: "「队伍前头并排站着两个姑娘，一样的脸，一样的发色，是缇宝和缇宁。」 · 「缇宝走到白厄面前，双手递上一卷信。她站得很稳，手没有抖。」 · 「缇宝站在门前，两只手撑着门板，冲他们喊：“快进去！”」"
    tinning:
      state: "Phim. Dung ben Tribbie o hang dau doan nguoi mac trang, khong ngap, chi giua co mot cho trong. Khong thoai."
      evidence: "「缇宁今天站得笔直，一个哈欠也没有打。」"
    hyacine:
      state: "Phim. Dung truoc nguoi, voi ten y si, tuyen bo cai chet cua Aglaea, giong phang. Sau do cung Dan Heng toi thanh tren may, hoi suot duong; roi tu tren cao, tay nam chat ao Dan Heng."
      evidence: "「风堇走到人前，戴着酒红色的小帽，以医师的身份宣告了她的死。她的声音很平，一个字也没有多出来。」 · 「风堇一路问个不停：“您累不累？」 · 「风堇的手还抓着丹恒的袖口，指节发白。」"
    krateros:
      state: "Phim. Bao tin Aglaea truoc dam dong: tay con dap thuoc, giong khan, ngung o chu 「坠」 roi noi tiep."
      evidence: "「克拉特鲁斯站在人群前，红披风搭在肩上，手上还敷着草药。他的嗓子哑得厉害，说到“坠”字，停了一停，才接下去」"
    mydei:
      state: "Phim. Dem Okhema tat den: chan mot con duong cung Castorice, mot cau 「这条街，我守」; khong ai nga tren con duong do."
      evidence: "「万敌挡在街的一侧，红黑的披风在夜风里甩开，一杆枪横在身前，他说了一句“这条街，我守”」 · 「这条街上没有人倒下。」"
    bartholos:
      # Canon NPC (贼灵), chua co note.
      state: "Phim. 巴特鲁斯 (贼灵): tra lai ngon lua Kephale 'Cipher nhet cho tu truoc' cho Phainon tren phim; noi 'ban ngay vinh vien' la loi noi doi cua Aglaea, Hoang minh chi hua ba tram nam. Tan thanh tro."
      evidence: "「它的名字是巴特鲁斯。」 · 「“她早先塞给我的。”」 · 「黎明机器当年就只许了三百年」 · 「它的身子从边上开始散，一粒一粒变成灰，被夜风吹走了。」"

