  characters:
    phainon:
      state: "Phong chieu, POV. Giu doi cua ch01 (khong xem arc 1). Cuoi chuong tu soat Okhema trong dau, khong thay nguoi nay trong tri nho minh: 「认到最后，里面没有这个人」; nghe tung cau de ghep ra giong o hang tap hoa va bong lung tren binh dai la mot nguoi; ngoi tien nguoi ve phia man. Tren phong: nhac Damianos nhu nguoi quen (「向来最会想歪点子」), Black Swan nhin, khong hoi. Tren phim (Phainon thoi dau): xong vao 涡心 bao dam cho Stelle + Dan Heng (「这两个人，我担保」), di Kremnos cung Mydei va Stelle."
      evidence: "「白厄想忍，没忍住，笑了一声。“达米亚诺斯这个人，”他说，“向来最会想歪点子。」 · 「“住手！这两个人，我担保！”」 · 「“凭我这一路的直觉。”」 · 「“我那时候，”他说，“跑得有这么快吗？”」 · 「货摊底下的声音，平台上的背影，是同一个人」 · 「认到最后，里面没有这个人。」 · 「他把手肘撑上膝盖，身子往前探了一截，离墙近了些。」"
    stelle:
      state: "Phong chieu. Tra loi to vang that: 「现在还不知道。”她说。」 / 「“不知道。”她说。」, moi lan to run; 「约定是我破的」. Tren phim: ngan Damianos nhay vach (「你不用飞了，我们就是证据。」). Di cung Castorice + Mem thu thap ky uc ve Kremnos o Okhema; nghe giong duoi hang tap hoa, lat tam bat len gap nguoi la (ao khoac xam xanh, so bia mem khong chu), noi chuyen vai cau, nem bien danh 「黑泥」 vi loi noi u am; nguoi do 「挺准的」; di tiep, khong hen gap lai. Phong: nho ra minh da noi 【黑泥那家伙提过的】; tu nhan 'chi la ten do toi dat'."
      evidence: "「“约定是我破的。”星说」 · 「现在还不知道。”她说。」 · 「“不知道。”她说。」 · 「你不用飞了，我们就是证据。」 · 「星用球棒的一头把篷布挑了起来。」 · 「就叫你黑泥。”」 · 「“墙上的我说过一句。”星看着墙，“【黑泥那家伙提过的】。有人问我黑泥是谁，我说不知道。”」 · 「“好像是。”」"
    march-7th:
      state: "Phong chieu. Anh selfie chua xoa bi lo tren phim (Damianos lat may): 「他看见我的自拍了！」, om may. Bi doi thanh 「粉霞天女」: nua ban nua tu hao. Phan ung khi Castorice tien: 「她走过来了！」. Sau canh can (Dan Heng dat may anh vao dia can): tay buong may ra, mieng khong ra chu. Dau chuong hoi Dan Heng/Himeko 「你们俩怎么了？」, bi Himeko chan. Sau canh hang tap hoa: nhan ra ao khoac xam xanh la cua bong lung ngay toa roi (「货厢掉下来那天，站在最高处看火光的那个，穿的也是这一件」)."
      evidence: "「“他看见我的自拍了！”她把相机整个抱到胸口」 · 「“我本人比那个好看多了！”她说，“不过，名字倒还行。”」 · 「“她走过来了！”三月七一把抓住身边的星」 · 「“你们俩怎么了？”」 · 「她抱着相机的手慢慢松开了一点，嘴张了张，一个字也没出来。」 · 「货厢掉下来那天，站在最高处看火光的那个，穿的也是这一件。」"
    dan-heng:
      state: "Phong chieu. Dau chuong ngoi thang, tay ep goi, khong tra loi March. Tren phim: dan Stelle ngan Damianos; tra to vang 「有人再往前一步，就会摔死」; cau 'co nho giao uoc' cham mot nhip roi moi dap 「我们记得，是我们没守住」; dat may anh cua March vao dia can Talanton. Phong, sau canh hang tap hoa: (1) giong duoi hang chinh la nguoi la (「货摊底下那个声音，”丹恒开口，“就是他」); (2) giong nay nghe 'giong' giong tren duong day arc 1, chi la 'giong' (「只是像」) - khong ten, khong ly do. Xem muc secrets (suspected_by)."
      evidence: "「丹恒没有答。他坐得很直，两只手按在膝头，指节绷着。」 · 「“有人再往前一步，就会摔死。”丹恒说。」 · 「丹恒停了一下才开口：“我们记得，是我们没守住。”」 · 「丹恒低头想了一会儿，从包里取出三月七的相机，放进托盘。」 · 「这个声音，我听着，像上一回线路里的那一个。只是像。」"
