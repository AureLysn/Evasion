      state: "Phim (Okhema, lan dau co mat o arc 2). Ngoi duoi hang tap hoa da thu tam bat, tren hop go lat nguoc, tay cam goi giay; an mien nhai cham, ca hai deu noi 'dinh rang' (「粘牙」). Toc nau rat sam, roi, khong chai; mat nau, mi nua dong nhu thieu ngu. Ao khoac ngan xam xanh, hang khuy xep cheo cai kin mot vai, ao so mi toi ben trong; tay giu cuon so bia mem khong chu, mep mon xo; giay vai mem de thap. Giong luoi, keo duoi, u am (khong ai khac nghe thay: 「你一开口，”她说，“我头顶的天就暗一格」). Hoi ten: 「这会儿用不上」; nhan bien danh 「黑泥」 (「挺准的」). Khong hen gap lai. Bi Aglaea hoi bang to (4 cau + dan: dung vao 'thien ngoai'): tra loi that nhung khong lo gi (「在这儿，用不上它」, 「吃，睡，看」); to khong dong; Aglaea 「我什么也没听到」. Nguoi nay la bong lung ngay toa roi o Okhema (phuong an B): cung ao khoac, cung so; dung o ben cao nhat nhin bui vang nikador roi; phong khong ten, khong biet la ai."
