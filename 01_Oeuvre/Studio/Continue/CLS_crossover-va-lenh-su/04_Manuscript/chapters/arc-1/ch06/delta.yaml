    jason-todd:
      state: "Phia duoc chieu, cuoi ngay FES. Tren dinh thap Pom-Pom, Jason di sau Ashveil, tay phai cam sung, mong sung chi xuong dat, khong nang. Khi Ashveil tu xung ten that 「拉曼查」 (lan dau Jason nghe), mat mo to them mot sat, ham co lai, ngon tay quanh can sung trang nhot; khong quay dau nhin Ashveil; mot nhip sau tay buong nua ngon. Dau tau dam thung san roi xuong ga cu; o ga, khi cai bong cua Ashveil lan ve phia ba Chien Binh, Jason nhin xuong sung, day chot an toan, nhet sung vao bao ben hong (khong bo sung xuong ma CAT LAI), lau tay vao ao khoac, buoc vao giua bong va ba nguoi, hai tay trong, mat nhin Ashveil; goi 「老板」; Ashveil 「让开」 · 「这是我的事」 — Jason khong nhuc nhich, khong dap. Noi 「别跟我说他们不是人了。」 roi 「人回得来。」; cai bong dung truoc mui giay mot ngon tay, roi rut ve. Sau do quay sang ba Chien Binh, dam 赤焰 liep tuc (ham, suon, khuyu goi), 苍翼, 曙光 ngay ca khi ho khong keu dau; khong nuong tay, khong ngung; ra tay den khi ca ba khong dung day noi, khop ngon tay phai nut, mau lan tro. Voi Ashveil: 「找不到法子，到头来这活我替你干，领队。」 · 「我好歹也算个巡海游侠。」 — Ashveil 「嗯」. Voi 灰烬: 「星星歪了。」 (lan hai) — KHONG quay mat di, KHONG tay vao, dung doi den khi 灰烬 tu sua xong ngoi sao. Cuoi cung o van phong Chan Chau: Ashveil hoi tien chuoi thang nay, Jason: 「数了。不够。」. Hanh dong 「nhet sung, khong ban」 va cau 「人回得来」 doc duoc la tinh li, khong phai loi thu nhan; khong ai trong phim giai thich vi sao han chac."
      evidence: "「不死途的长外套扣到领口，杰森右手垂在身侧，握着枪，枪口朝地。」 · 「他的眼睛睁大了一线，下颌两侧的肌肉绷紧，握枪的手指在枪柄上收拢，指节泛白。他没有转头去看不死途。」 · 「杰森低头看了一眼手里的枪，拇指推上保险，枪口滑进腰侧的枪套，皮扣啪地扣上。」 · 「他走进去，走到影子和那三个人中间，两手空着，面朝不死途。影子离他的靴尖还有一臂远。」 · 「“别跟我说他们不是人了。”」 · 「“人回得来。”」 · 「影子的最前沿细成一条线，爬到他靴尖前一指的地方，停住了。」 · 「杰森一拳打在他下巴上。」 · 「杰森没有因为他们不喊疼而收力，也没有停手。每一拳都落在同一个地方：下颌，肋下，膝弯。」 · 「“找不到法子，到头来这活我替你干，领队。”」 · 「“我好歹也算个巡海游侠。”」 · 「“嗯。”不死途说。」 · 「“星星歪了。”」 · 「杰森没有转开脸，也没有伸手。他站在那里，两只手垂着，脚跟没有挪，等。」 · 「“数了。”他说，“不够。”」"
