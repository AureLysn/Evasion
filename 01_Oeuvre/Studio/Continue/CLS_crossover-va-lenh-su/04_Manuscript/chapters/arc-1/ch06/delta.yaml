      # Note nhan vat: MAIN-DATABASE/HSR/Ashveil.md (khong phai note project). State tren relationship note + jason-todd. AUREL (3): co tao note project rieng khong? MAC DINH: khong.
      state: "Tren dinh thap, cuon tay ao phai den khuyu tay, lo hang 铆钉 o co tay phai; dung 起子 (can quan vai cu) rut MOT 铆钉 (xoay nua vong, roi nua vong). Noi: 「你们报过名了。按规矩，我也报一个。」 roi 「拉曼查。」, giong khong cao, bao cho mot cai xac thep nghe, xep sau khau hieu cua bon dua tre. Cai bong tu lo dinh o co tay phai tran ra, leo len giap may 帕姆王 lam lop son boc va banh rang keu; ngan co mat khoang thang bi no ra, bon nguoi ben trong bi quang ra, giap sap. Sau do dau tau dam thung san va keo moi nguoi xuong ga bo hoang. O ga, giai thich ve ba Chien Binh: 「动过那个手术，他们只剩一样本事：碰上高兴的事，会笑，会跳。别的，没了。」 (tu choi cau xin cua 灰烬: 「没必要。」). Bong duoi chan dai hon anh den phai co, tran khong tieng. Khi Jason chan truoc: 「让开。」 · 「这是我的事。」 roi bong dung truoc mui giay Jason, rut ve vao tay ao; cam lai 铆钉 va xoan vao co tay, cham, dep. Nhin Jason; khong noi vi sao dung. Doi Jason noi 「找不到法子……领队」 · 「我好歹也算个巡海游侠」 chi dap 「嗯。」 — KHONG ro Ashveil biet hay khong biet Jason 'tu nhan' la 巡海游侠 (doc duoc ca hai cach). O van phong Chan Chau: hoi cua Chan Chau 「你的影子，尝到什么了？」 — 「什么也没尝到。」; nhin ba mot nhip dai hon moi lan, ham nang len, roi ha; tay phai nam chat trong ong tay ao, buong. Sau do quay lung ve phia cua so, hoi 「这个月的香蕉钱，你数过了？」"
      evidence: "「他从内袋里摸出那把缠着旧布的起子，抵住其中一颗，拧了半圈，又半圈，铆钉退出来，落进他的掌心。」 · 「“你们报过名了。”不死途说。“按规矩，我也报一个。”」 · 「“拉曼查。”」 · 「“没必要。”不死途说。他的脸上什么也没有。“动过那个手术，他们只剩一样本事：碰上高兴的事，会笑，会跳。别的，没了。”」 · 「“让开。”不死途说。」 · 「“这是我的事。”不死途说。」 · 「影子的最前沿细成一条线，爬到他靴尖前一指的地方，停住了。」 · 「黑影沿着地面往回缩，缩过铁轨，缩上他的靴子，缩进卷起的袖口。」 · 「他没说为什么停。杰森也没有问。」 · 「“你的影子，尝到什么了？”」 · 「“什么也没尝到。”」 · 「他的下巴抬起一点，又放平。他什么都没说。他的右手在袖口里握了一下，松开。」 · 「“这个月的香蕉钱，”他说，没有回头，“你数过了？”」"
    magnus:
      # 灰烬. Chua co note project (xem delta ch05, AUREL (5) cu). Giu "chua tao".
      state: "Tren dinh thap: o ngoai cung hang bon, cham mot nhip khi hoat dong chao 「破晓战队，上场」, mat da do; ban mien khong ten. O ga: khong cuoi (ba dong doi dang cuoi), chay den cach Ashveil hai buoc, xin cho dong doi: 「他们只是高兴过了头！请您高抬贵手」 — Ashveil 「没必要」. Khi Jason ra tay: dung xa, hai tay nam vat ao, vai rut lai moi cu dam, chan khong buoc ve truoc. Khi Jason dung truoc mat cau, 「星星歪了」 lan hai: cau cui xuong, tay run, nhung ngoi sao nghieng lai; vuot sua ba lan, ngon tay moc chi vao cho rach, ngoi sao thang o lan thu ba; cau lay long ban tay an phang, ngang mat, moi mo nhung khong thanh tieng. Jason dung do, khong giup. Luc ket: ngoi canh ba nguoi, bat vai 赤焰; roi hoi Kuchiba 「我……可以一起去吗？」 — Kuchiba 「跟上。」 (cau di theo dong doi bi con, khong bi bo lai mot minh)."
      evidence: "「灰烬站在最边上，慢了半拍，才把拳头抬到胸口，脸已经红了。」 · 「灰烬没有笑。他爬起来，顾不上扶星星，几步冲到不死途面前，离他只有两步。“侦探先生！”声音破了一下，“他们只是高兴过了头！请您高抬贵手」 · 「灰烬站得更远，两只手攥着制服的下摆，杰森的每一拳落下去，他的肩膀就缩一下，脚没有往前迈。」 · 「“星星歪了。”」 · 「灰烬低头，伸手去扶。手在抖，扶了一下，星又歪回去。再扶，还是歪。」 · 「灰烬扶到第三下，金星正了。他用手掌把它按平，抬起头，嘴唇动了动，没出声。杰森还站在那儿。」 · 「灰烬蹲在三个人旁边，一只手轻轻搭在赤焰的肩上。」 · 「“我……可以一起去吗？”」 · 「“跟上。”」"
    chi-yan-cang-yi-shu-guang:
      # 赤焰 · 苍翼 · 曙光 — gop mot muc. Chua co note project. De xuat khong tao (xem new_entities).
      state: "Ba Chien Binh Biet Doi Binh Minh. Tren dinh thap hop nhat voi tuong Pom-Pom thanh 合金机铠•帕姆王, ra ngoai hieu 「清场」; bi bong cua Ashveil pha vo, rot xuong ga. O ga: thuong tich tu lanh — 赤焰 gay tay trai, tu van lai, 「不疼！」; 苍翼 xuong suon nhu len roi ha lai; 曙光 goi keu mot tieng roi thang; ho 「最强的」, cuoi, 「没人堵得住我们」. Ashveil: sau 「手术」 chi con biet cuoi va nhay; Jason dam ho nhieu lan: 赤焰 dung len bay lan (lan 3 con cuoi, lan 4 chan cham, lan 5 mot canh tay khong tro ve, lan 6 ham lech, lan 7 khong dung); 苍翼 ba lan, lan bon quy goi khong roi dat; 曙光 bon lan, lan cuoi tu the dung giua chung. Khong ai keu dau. Cuoi: nam tren dat, tho nong, xuong dang tu tu cung tro lai (cham hon luc dau). Kuchiba kiem tra mach tung nguoi: ca ba con tho. Cuoi cung bi Kuchiba con tay (治安官手铐), van cuoi: 「这个是新款！」."
      evidence: "「四个人一齐往后跃，跳进雕像的肚子里。」 · 「合金机铠•帕姆王。」 · 「赤焰先坐起来，左小臂折成了一个怪角度。他低头看了看，骂了一句，抓住那截手臂一拧，咔，自己归了位。他举起来冲同伴晃：“看到没！不疼！”」 · 「“我们现在可是最强的！”」 · 「“这回没人堵得住我们了！”」 · 「赤焰又倒下去，骨头在皮肉底下咔咔地拧回原位，他又站起来。第三次站起来的时候，笑还在，嘴里多了一口灰。第四次，他的腿慢了半拍。第五次，他撑起一条胳膊，另一条胳膊折在身下，咔，咔，没有拧回来。第六次，他抬起头，想笑，下颌偏向了一边。第七次，他没有站起来。」 · 「他爬起来四次，每次都摆，最后一次，姿势停在半途，没有摆完。」 · 「三个人横在灰里。胸口一起一伏，起伏得很浅，浅到要盯着看。皮肉底下，骨头一点一点往回拱，拱得很慢。」 · 「朽叶把三个人一个一个拖到柱子边靠着，蹲下去，两根手指依次按在他们的颈侧，按得很久，抬头冲不死途点了点头。三个还在喘。」 · 「“哇，”赤焰低头看着手腕，“这个是新款！”」"
    boothill:
      state: "Phong chieu, POV. Nghe 拉曼查 tu manh hinh lan thu hai (lan mot: tu Stelle o ch01); nhan ra dieu nay: ten do da duoc noi ra khong nhu nguoi ta tuong, 「是报给一具铁壳听的，还排在四个孩子的口号后头」; ngon tay go vao tay vin mot cai, kim loai cham go. Khi Stelle toi cho ke 'cai bong nuot ba nguoi' va Himeko cat, Boothill nhan ra Stelle nuot cau sau: 「这个球棒宝贝平时从不卖关子，今天头一回」. Khi Rappa hoi 「看清楚了？」, Boothill dap 「看清了」 (truoc do ngam thay Jason bo sung xuong roi buoc vao). Sau do doc loi Jason cho phong: 「他把活接过去了，接在自己手上。什么时候动手，等法子都用光了再说。巡海游侠都认这个理，有人叫就去，有活就接。」 (dua vao le 巡海游侠, khong ben vuc Jason bang cach ha Ashveil, khong doc theo dung/sai). Khi Himeko hoi 「凭什么这么有把握」, Boothill khong tra loi; doc 「人回得来」 la 嘴硬 (tinh li); nghi den viec muon gap nguoi nay: 「想隔着一张桌子，请他喝一杯，听他把香蕉账再数一遍」. Cuoi chuong cuoi mot tieng khi nghe 「数了，不够」 va bat chuoc giong Jason (khong giong)."
      evidence: "「这个名字他在这间屋子里听过一回，是球棒宝贝说的」 · 「他找这个名字找过多少颗星球，没料到找到的时候，它是这么来的。他的指节在扶手上敲了一下，金属磕着木头，比他预想的响。」 · 「波提欧听得出来，她把下半句吞回去了。这个球棒宝贝平时从不卖关子，今天头一回。」 · 「走廊里那回，是这小子先开的枪……这回他先把枪放下了，空着两只手走进去。波提欧看得比谁都清楚，所以他没有出声打断。」 · 「“他自己说了。”他说，“【找不到法子，到头来这活我替你干，领队。】【我好歹也算个巡海游侠。】”」 · 「“他把活接过去了，接在自己手上。……巡海游侠都认这个理，有人叫就去，有活就接。”」 · 「波提欧也没有答。」 · 「那句话波提欧从头到尾听了三遍，读到的只有一样东西，嘴硬，硬得没给自己留退路的那种。他想见这个人。想隔着一张桌子，请他喝一杯，听他把香蕉账再数一遍。」 · 「“数了，不够。”他学了一遍杰森的腔调，学得一点也不像。」"
    rappa:
      state: "Phong chieu. Thich giap may khong lo: 「巨大的机铠！忍者的梦想！」; xin Boothill dung tha: 「在下要看它跑！」. Sau ga, ngoi ngay ngan, kiem ngang dui, goi Boothill 「银枪•修罗殿下」 (dang TextMap, quyet 22/10), goi Jason 「保镖忍者」; noi ra: 「保镖忍者是岚的人，殿下在走廊里见过他开枪。躺在地上的三个，身上带着丰饶的东西，不知道疼，断了自己会长。那样的东西，岚见一个猎一个。他把枪收了，站到它们前头去了。在下只是把看见的说出来。」 Khong buoc toi, khong 令使, khong cu chi vet me kiem. Nghe Boothill, hu nhe, go kiem hai lan: 「在下记住了。在下没有说他错。」"
      evidence: "「“在下喜欢！”Rappa 在椅背上拍手……“巨大的机铠！忍者的梦想！”」 · 「“殿下，不许拆！”Rappa 回头，“在下要看它跑！”」 · 「她没有蹲上椅背，端端正正坐在座位里，长剑横在腿上。“银枪•修罗殿下，看清楚了？”」 · 「“保镖忍者是岚的人，殿下在走廊里见过他开枪。”」 · 「“躺在地上的三个，身上带着丰饶的东西，不知道疼，断了自己会长。那样的东西，岚见一个猎一个。”……“他把枪收了，站到它们前头去了。在下只是把看见的说出来。”」 · 「“在下记住了。”她说。“在下没有说他错。”」"
    ranger-new-a-b-c:
      # Ba Canh Binh (巡海游侠) 甲/乙/丙 — dung cac ma cu cua delta ch05 (ranger-new-a/b/c) gop mot muc cho gon. Khong ten, khong note.
      state: "Nghe ten 拉曼查 lan dau tu chinh nguoi ho tim (qua phim, tren man hinh). 甲 (thap-tran) dung phat day, dai vo dan keu, doc cham tung chu, mom con ha: 「【拉曼查】……」; 乙 (nu cao gay) thao ong nham dong khoi that lung, nam trong tay, khong nang len, sau khi nghe Stelle ke 「是什么口气？」 — Stelle: 「跟平时一样」, 乙 gat dau, khong hoi nua; 丙 (tre) day non len mot thon, lo ca khuon mat lan dau tu khi vao phong. Tren phim 丙 nghieng nguoi ve truoc, 乙 nam chat ong nham den tim ngon tay, co tieng 「啊」 khong thanh cau. Sau khi Boothill tra loi Rappa va nhac chu 领队/巡海游侠: 甲 gat dau mot cai (khong keu dan), 乙 quay mat nhin Boothill lau hon bat cu luc nao, 丙 ha tay tren bao sung xuong goi. Cuoi: ba nguoi cuoi (khong thanh tieng) khi nghe 「数了，不够」. Khong ai hoi Jason la ai / ai keo han vao / tu khi nao; khong ai phan xet 拉曼查."
      evidence: "「后排矮壮的那个站了起来。腰带上那一串空弹壳哗啦响了一阵，他自己没发觉。他把那个名字念得很慢，一个字，再一个字，念完嘴还张着。 “【拉曼查】……”」 · 「穿斗篷的女人解下腰间的黄铜望远镜，捏在手里，没有举起来。戴机械手套的年轻人把压得很低的帽檐往上推了一寸，露出整张脸，这是进屋以来头一回。」 · 「斗篷的女人把望远镜在手里转了半圈。“他说话的时候，”她问星，“是什么口气？”……星想了想。“跟平时一样。”……女人点了点头，没有再问。」 · 「后排戴机械手套的年轻人整个人往前倾，倾出了椅背的弧度。斗篷的女人把望远镜攥在手里，指节发白。不知道是谁在后头“啊”了一声，没成句。」 · 「后排矮壮的那个点了一下头，只一下，弹壳没响。斗篷的女人转过脸，看波提欧看得比进屋以来任何时候都久。戴机械手套的年轻人把一直搭在枪套上的手拿下来，放到膝盖上。」 · 「后排的弹壳响了一声，斗篷的女人抿住了嘴，年轻人把帽檐重新拉低，拉得很慢，帽檐底下的人在笑。」"
    welt:
      state: "Vet nut tren kinh deo mat: nhanh nho tach ra o ch05 nay dai them mot doan roi re mot goc, bo dau toi mep khung kinh moi dung (6.03, khi Ashveil tuyen ba Chien Binh chi con phan ung voi niem vui). Welt khong cham vao (cung cu chi o ch05). Khi Himeko bao 「别出声，让它往下走」 (ngay sau luc bong dung), Welt 「没有回头，只是微微点了一下头」. Cuoi chuong: thao kinh lau roi deo lai, khoe mieng co nep mong (dang cuoi)."
      evidence: "「瓦尔特镜片上那条细枝又往外长了一截，拐了个弯，爬到镜框的边缘才停住。他没有去碰。」 · 「瓦尔特没有回头，只是微微点了一下头。」 · 「瓦尔特把眼镜摘下来擦了一下，戴回去的时候，嘴边有一道很浅的纹。」"
    kuchiba:
      # 朽叶 — 治安官. Da co trong MAIN-DATABASE (ch05). Chi ghi nhan chi tiet ch06.
      state: "Tren thap: cung Stelle va March toi truoc, dung tua ro da. O ga: dung cach ba buoc, tay dat len day da o hong (khong keo xuong), khong can thiep khi Jason tan ba nguoi. Sau do keo ba nguoi vao ben cot, kiem tra mach o co tung nguoi, gat dau voi Ashveil. O van phong Chan Chau: dung 治安官手铐 khoa tay tay ca ba (thu 'tinh nguoi' cua ho). Cho 灰烬 di theo (「跟上。」). Truoc khi ra, quay lai nhin Jason lau hon can thiet, khong noi gi; cua dong sau lung, Jason nhin cua den khi tam van het rung. 'Nhin lau hon can thiet' — khong bien thanh y nghia (AUREL (4): MAC DINH khong ghi y nghia)."
      evidence: "「朽叶站在三步外，手按在腰间的皮绳上，没有动。」 · 「朽叶把三个人一个一个拖到柱子边靠着，蹲下去，两根手指依次按在他们的颈侧，按得很久，抬头冲不死途点了点头。三个还在喘。」 · 「朽叶从腰间取下治安官的手铐，一副一副，把那三个人的手腕锁上。」 · 「“人我带走。”朽叶对不死途说。」 · 「“跟上。”走到门口，她又回头，看杰森，看得比需要的久，什么也没说，门在她身后合上了。杰森盯着那扇门，直到门板不再晃。」"
    pearl:
      # 真珠 — MAIN-DATABASE/HSR. Chi ghi chi tiet ch06.
      state: "Lan thu hai tren phim (lan mot: ch02). O tang tren cung 珠星大厦, chan tran, toc vang dai toi mat ca chan, vong anh sang tren dau. Cau dau tien khong nhin nguoi ma nhin ong tay ao Ashveil: 「你的影子，尝到什么了？」; Ashveil 「什么也没尝到。」 — co nhin lau hon, khong hoi them, hai tay ra sau lung; vong anh sang khong doi. Khong ta cach keo moi nguoi ve (mot cu cat)."
      evidence: "「珠星大厦的顶层，窗外是整座城市的灯。真珠站在桌子后面，光着脚，金发垂到脚踝，头顶那圈小光环亮着。」 · 「真珠第一眼看的是不死途的右袖口，没有看人。“你的影子，尝到什么了？”」 · 「“什么也没尝到。”」 · 「真珠把双手背到身后，没有再问。头顶那圈小光环亮着，亮度一点也没变。」"
    stelle:
      state: "Phong chieu. Noi 「后面的我记得」 truoc khi phim chieu, ke den luc cai bong nuot ba nguoi ('只剩灰烬一个人的影子'), Himeko ngan: 「到这儿。再往后，让画面自己讲。」 Stelle: 「我本来也只想说到这儿。」; nuot nua cau sau (Boothill nhan ra). Tra loi March: 「知道。想了一路，没想出怎么讲才不算剧透。」 Phim lech ket cuc nho: Stelle nhin cai bong dung: 「影子停了。」 · 「三个人都在喘气。影子没碰他们。」 Tren phim: dung bong tren thap bang gay, lon tranh nam dam, hoi 「你们……没事吧？」 voi ba Chien Binh sau khi roi xuong; Stelle va March roi xuong ga cung moi nguoi."
      evidence: "「“后面的我记得。”她把球棒立在两腿之间，下巴搁上去，“掉下去是个旧站台，没人的那种。灰烬他们四个先爬起来，骨头自己接上了，高兴得很，站在那儿比谁的胳膊拧得直。灰烬跑去求不死途。不死途说没必要。然后影子从他脚底下出来，把另外三个人吞了。影子收回去以后，地上只剩灰烬一个人的影子。接下来……”」 · 「“星。”姬子说。……“到这儿。再往后，让画面自己讲。”」 · 「“我本来也只想说到这儿。”星说。」 · 「“你一路都知道？”三月七小声问。“知道。”星说，“想了一路，没想出怎么讲才不算剧透。”」 · 「“影子停了。”星说。」 · 「“三个人都在喘气。”她说，“影子没碰他们。”」"
    himeko:
      state: "Phong chieu. Chan Stelle ke nua chung (「到这儿」) — dung vai tro keo phong lai. Sau Rappa va Boothill, hoi ca phong, giong rat vung: nhac lai 「别跟我说他们不是人了」 va 「人回得来」, hoi 「他凭什么这么有把握？」. KHONG AI TRA LOI (hook h-nguoi-ta-ve-duoc: treo). Khong tu doan, khong tiep cau."
      evidence: "「“星。”姬子说。杯子放在扶手上，她的声音不高，“到这儿。再往后，让画面自己讲。”」 · 「“墙上的他说过一句，【别跟我说他们不是人了】。”她说，“后面跟着一句【人回得来】。”她问的是整间屋子，嗓子压得很稳，“他凭什么这么有把握？”」 · 「波提欧也没有答。」"
    aventurine:
      state: "Phong chieu. Im lang (D6/B4) khi Himeko hoi 「凭什么这么有把握」 — 「砂金靠进椅背，十指在腹前交叠，一个字也没有。」 Khong cu chi dong xu. O 6.05, tra loi Stelle ve 「小东西」 (cau dua cua ch02): 「我说的是，别带着它睡觉。」 · 「没说过，别带着它下地底。」 · 「别算了。算起来只会更难受。」 — dong xu dinh vi (筹码) 真珠 tang Stelle la thiet bi dinh vi; Aventurine khong giai thich them, khong noi gia. Lan nay anh KHONG dinh gia Jason (de ch07)."
      evidence: "「砂金靠进椅背，十指在腹前交叠，一个字也没有。」 · 「“你说的小东西，就是这个？”」 · 「“我说的是，别带着它睡觉。”砂金的声音很温和，“没说过，别带着它下地底。”」 · 「“别算了。”砂金说，“算起来只会更难受。”」 · 「“定位器。”不死途说，“只要真珠那头还能靠它找到我们，我们就困不在这儿。”」"

