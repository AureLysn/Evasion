  characters:

    tsuna:
      state_add: "TRON NHA DI, va de lai mot manh giay — nam ban nhap, ban thu tu bi vut vi ket bang 'I am sorry to be a burden'. Lan dau dung May thu cap de di xa: khong phai nen Bau troi xuong ma la khong boc lo ra. Sang Y mot minh bay tuoi qua mang luoi den. Sap xep cho DUA TRE THU 52 mot gia dinh o Mie va CO Y khong vao gap con be. Bi Varia bat gap o Genoa, thoat duoc, va Xanxus da dung tu 'acquisition'. Vut chiec ao khoac xam o Vercelli."
      evidence: "I have gone to Italy. There is one thing there I did not finish and I am going to finish it. / You do not get to be forgiven by somebody you have not met. That's not what she's for. / He threw the coat away at Vercelli."
      aurel_D: "🔴 Bac 3 da leo. Phep do la MANH GIAY: mot dua bo nha di thi khong de lai giay; mot dua biet minh se duoc nho thi co."

    natsu:
      state_add: "Lan DAU roi Namimori. Di Y trong tui ao. Bi mot nguoi thu ba nhin thay lan dau ke tu khi toi. Xep hang nguoi Y, duoi bo cau qua mot quang truong, va bi duoi khoi gia nen trong mot nha tho. Luc Tsuna chay, no di XUYEN QUA mot xe day hanh ly dung luc cau dong — khong ai bao no."
      evidence: "It had gone through the trolley. It had not gone around it, and it had not gone over. It had gone through… and it had done that at the exact moment the boy moved, without being told."

    mammon:
      state_add: "LEN TRANG LAN DAU. Nhin thay con cao ngay cau dau tien, goi thang ten loai. Dung Thoughtography (nuoc mui) va ra dung MOT dia diem — mot thi tran o Nhat — trong khi mot nguoi binh thuong ra bon den sau. Mo so sach va tim thay mot cot khong cong duoc: ba trong bon lan 'duoc giup' co truoc cuoc dieu tra, va MOT lan co truoc ca vu xoa so. 🔴 Bao cao KHONG day du: giau ca con cao lan cot so."
      evidence: "They did not mention the fox. They did not mention the column that did not add. / You got one. Seven years old, and the whole of you is one town."
      aurel_E: "🔴 Ly do ho giau, chuong ghi ro: mot cau tra loi day du tieu ngay khi giao, mot cau tra loi khong day du thi con sinh loi. Va: ho la Arcobaleno AM ANH NHAT voi viec pha loi nguyen, nen 'thu moi dau tien trong muoi mot nam' la mot mon hang."

    xanxus:
      state_add: "LEN TRANG LAN DAU, khoang 17 tuoi, CHUA co seo. Da la thu linh Varia. Dan doi di dieu tra vu Estraneo; chinh doi cua ong DOT phong luu tru o Savona. Doi tu nghi ngo sang them muon dung luc thay mot Cloud — bao cau bat May len roi DUNG TRONG NO. Hoi Squalo ve thu tuc 'acquisition' cua Nono. Cuoi chuong ra lenh: 'Namimori. Pack.'"
      evidence: "Turn it back on. The Cloud. You dropped it when I came up the platform. / How long does the Ninth's paperwork take on an acquisition. / Namimori, Xanxus said, trying the word out, and then, to the room: Pack."
      aurel_F: "🔴 Rang buoc GIU NGUYEN: ong KHONG biet Tsuna la Sky. Ong duoi mot Cloud. Va tuyen-xanxus cho hoa hop hai chieu sau Cradle la 'May cua Tsuna -> Bau troi cua Xanxus', nen o day ong dang duoi theo dung cai thu sau nay se la May cua ong."

    kyouya:
      state_add: "Tinh luc 00:04 va biet 'con vat nho dang roi lanh tho'. Doc duoc HUONG va TOC DO. Lam phep tinh, thay moi phuong an deu toi muon hai toi chin tieng, nen nam xuong lai va khong ngu. 🔴 Ghi nhan soi day KHONG mong di — nhung cau ta KHONG biet vi sao minh cam duoc, va KHONG biet bond neo o dau."
      evidence: "The small animal was leaving the territory. / He lay in the dark with his attention on the thread… and he noted without any interest in the fact that it had not gone thin."

    musashi:
      state_add: "Don ban cua Tsuna ra khoi kho lanh vao phong canh sanh chinh, CO Y khong hoi, va noi thang ly do: 'vi con se dong y trong khoang bon giay'. Tu nhan la da lam mot viec vo le co chu dich. Noi ra chuyen bon tieng tren san lanh mua dong truoc. Di lai phai dung tung chang."
