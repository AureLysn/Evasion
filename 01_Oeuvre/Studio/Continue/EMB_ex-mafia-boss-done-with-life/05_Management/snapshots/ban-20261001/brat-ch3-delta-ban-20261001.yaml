      state_add: "CO TEN. Tsuna dat la Tomoshibi — den nho dat ben duong, lay tu kitsunebi. KHONG phai Natsu, va cung khong phai mot cai ten ne tranh Natsu. Nhan ten xong no bo di ngoi cho khac, quay lung lai, roi mot luc sau len bau cua so nhin cay. Van chua biet minh la ai. Trong nam qua no da doc toan bo thu tu trong nha va co he thong xep hang rieng; no doc duoc NGUOI chu khong doc duoc Flame."
      evidence: "So, he said. Tomoshibi. / A lamp, he said. A little one. The kind somebody puts out at the road so that whoever is walking can see where the road is. / It did not come back to his knee. It went to the window, and up onto the sill."
      aurel_A: "🔴 CAN AUREL QUYET. Giu ten note la natsu.md va Tomoshibi chi la alias, hay doi? De xuat: GIU natsu.md, vi ca ho so xay quanh cau hoi 'cao tung la Natsu'. Chi them alias, khong doi ten file."

    tsuna:
      state_add: "Dat ten cho con cao, va hieu ra vi sao mot nam qua khong dat duoc: cau chua cho phep CHINH MINH mang mot ten moi. Pha quy trinh ba luot — giao mot la thu cho cao doc va khong kiem lai. Do lai loi: moc o soulscape lui tu muoi mot buoc xuong CHIN, hai buoc mot nam, va nhan ra viec ay da chay am tham suot nam. Noi ra mot dieu minh MUON (di ra song) ma khong co ich gi, roi di that. Nhan ra minh khong biet minh thich gi — cai gu cau dang mang la cua nguoi kiep truoc."
      evidence: "Nine paces. Last autumn: eleven. / I want to go outside, Tsuna said. / I don't even know if I like rivers. / I've been going around in a name that belongs to a dead man."

    kawahira:
      state_add: "Hoi tuong lam ro dam phan: chay BA NGAY, khong phai mot. Hai ngay dau ve Estraneo; ngay thu ba la Tsuna tu quay lai vi CHINH MINH. Ong noi thang cai gia cua harmonisation: no hoan lai cai ket ma ong da doi tu truoc khi hon dao nay co ten. Ong nhan loi vi Tsuna la nguoi dau tien MOI ONG LOI RA, va vi cau noi that. Bay ngay sau ong gui ong tre, va tu do KHONG quay lai."
      evidence: "I have carried a job since before this island had a name. / A Guardian does not get to put the weight down while the Sky is still standing. / Your offer was worse than his in every respect but one. You meant it."
      aurel_B: "Chi tiet moi do chuong sinh ra: NGUOI DAM PHAN TRUOC — chuan bi chin thang, biet Kawahira la gi, mang ba luan diem va mot loi de doa, bi tu choi, chet mot cai chet binh thuong khoang bon tram nam truoc. Neu Aurel thay day la tuyen dang giu thi no can note rieng; neu khong thi de nguyen trong van."

    nagi:
      state_add: "Doi teapot ra xa cho con cao moi khi Tsuna noi chuyen voi khong khi, va KHONG BAO GIO hoi. Da lam viec nay du lau de thanh phan xa."
      evidence: "Nagi did that. She was doing it now, from the doorway, without breaking stride."

    indra:
      state_add: "Thay chong thu bi sap xep lai boi mot thu khong ai dat tay vao, va chi noi mot cau roi di. Dat mot chen tra xuong canh dau goi Tsuna tren duong di qua."
      evidence: "Somebody has been efficient this morning, she said, without slowing down. / She set one of the cups by his knee on the way past."
      aurel_C: "🔴 CAN AUREL QUYET. Indra co dang nghi gi khong? Chuong CO Y khong noi. Chua co secret note nao cho viec 'Tsuna co mot con vat khong ai thay', nen hien KHONG CO CHO GHI. De xuat: dung ghi gi vao indra.md; neu Aurel muon giu cai nhin ay thi tao secret moi (xem new_entities)."

