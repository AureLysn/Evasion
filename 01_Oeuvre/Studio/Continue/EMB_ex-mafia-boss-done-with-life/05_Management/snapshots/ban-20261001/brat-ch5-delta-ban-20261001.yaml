  # ================================================================ NHAN VAT
  characters:

    tsuna:
      state_add: "Ve den Namimori 18:40 ngay 11/01, muon mot ngay chin tieng so voi han RIENG cua cau (cau giu hai han: mong muoi cho minh, muoi mot cho ba). Den noi thi moi viec DA XONG. Lan dau doi mat voi viec thi tran tu xu ly mot doi am sat ma khong can cau tinh — va cau khong chiu duoc dieu do theo mot cach cau chua goi ten duoc. 🔴 Bat dau nghi ngo chinh 567 ke hoach: 'how many of them are just vanity with a filing system'. Truot mieng truoc mat Xanxus mot cau co NGAY THANG trong do, va biet ngay minh vua lam gi."
      evidence: "not one of those preparations had needed him to be awake for it. / I built five hundred and sixty seven plans on the assumption that if I did not do a thing, the thing would not get done. / He said eventually. I have just handed eventually a calendar."
      aurel_D: "🔴 Day la vet nut DAU TIEN tren 567 ke hoach, va no den tu mot chien thang chu khong phai mot that bai. Dang gia hon moi cach khac de lam no nut."

    musashi:
      state_add: "Mo hop duoi kho bac, lay ra BAN GOC hop dong Sanctuary (khong phai ban sao) — thu ra khoi kho khoang mot lan moi doi nguoi. Doc dieu khoan HAI LAN truoc mat Varia, co y, de sau khong ai cai duoc la chua duoc bao. Chan con dao thu ba o bon centimet khoi co hong Kyouya MA KHONG CAN NHIN. Keo bay bond nha va GIU suot chin tieng, tu choi tha, vi ba dang thich the. Ky ban ngung ban luc chin gio toi."
      evidence: "She had been a Gen'ei for fifty-eight years. She had not needed to see the road to know what the road was doing. / Because I have not released it, and I will not release it until I am satisfied, and everyone concerned understands that I am an old woman who is enjoying this."

    ayame:
      state_add: "🔴 Trung dao. Con dao thu hai xuyen qua cang tay TRAI va ra phia ben kia. Truoc khi ngat, doc nguyen van tu cach phap ly cua vet thuong: 'That was an attack by an outsider, on a resident, inside the boundary. Three witnesses.' Nam giuong chin tieng, Tomoko cham, va da noi voi bon nguoi rang co 'got it in writing'."
      evidence: "The second went through her left forearm and out the other side. / Then she said, Ow, in exactly the voice she used for dropping a ledger, and fell over."
      aurel_E: "⚠️ Vet thuong nay la thu kich hoat dieu khoan. Ayame khong phai nan nhan trong canh nay — co la NGUOI KY TEN."

    kyouya:
      state_add: "🔴 Dung tren tuong o khuc queo thu ba suot hai tieng va KHONG DONG THU khi Varia di qua, ke ca khi Belphegor nem dao vao chinh cau. Day la viec kho nhat doi cau, va cau biet truoc la se kho. Indra giu cau bang Yasuragi sau khi Ayame nga. Cau da cam thay bond dich chuyen suot bon thang truoc do — mot thu cua cau ra khoi lanh tho roi quay ve."
      evidence: "He had understood it perfectly. He had then explained back to her, in fewer, that he was aware, that he was not going to move first, and that this was, for the avoidance of doubt, the single most difficult thing anybody had ever asked him to do."
      aurel_F: "🔵 Bac 4 cua Kyouya, nhung nguoc: cai cau lam la KHONG lam gi. Chuong do no bang hai tieng dong ho, khong bang mot cau tuyen bo."

    indra:
      state_add: "Doan truoc con trai se ra duong tu chieu hom truoc — vi cau NGUNG CAI. Dung bon met phia sau cau suot hai tieng. Giu cau lai bang Yasuragi khi Ayame nga, va noi thang cho cau biet cau vua mua duoc gi cho thi tran. Xuat hien tren bac den duoi ten nghi le Hibari Seiran."
      evidence: "Then be angry afterwards, said Hibari Seiran, because the clause is ours now, and if you move it stops being ours, and I am not letting go until you have finished being eleven."

    mammon:
      state_add: "🔴 Tim ra dong Sanctuary trong hien chuong thi xa luc 2 gio sang, VA mot ghi chu le co dau 18 thang tuoi cho thay VINDICE da hoi ve noi nay. KHONG danh thuc Xanxus. Sau do giao cho boss MOT phan su that (co ho so Vindice) va giu lai HAI phan: (a) loi hoi den TU BEN TRONG Sanctuary, (b) cai cot bon lan duoc giup. Tieng Nhat cua ho tot hon ca doi biet, va da the tu thap nien 1940. Lan dau trong muoi mot nam tieng Nhat ay co gia tri."
      evidence: "Mammon did not mention the second thing. / A complete answer is spent when it is delivered. An incomplete one goes on earning for years. / Nobody writes to Bermuda von Veckenschtein. Nobody is answered."
      aurel_G: "🔴 Dong co that su khong phai tien: mot thi tran co DUONG DAY toi Warden of Vendicare la thu duy nhat co the lien quan toi viec go loi nguyen Arcobaleno. Ho da tim muoi mot nam."

    xanxus:
      state_add: "🔴 Toi Namimori dinh 'acquire' mot dua tre, va di ve tay khong sau khi KY mot ban ngung ban tren bac den. Bi doc cho nghe mot van ban bon tram nam tuoi hai lan. Phai QUAY NGUOC LEN DOI — lan dau trong doi. Dung tu 'Sawada' voi Tsuna: cai ho cau be DA TU CHOI dua o Liguria, nen cau ta da di lay no cho khac va giu den luc nay moi dung. Nghe mot cau co ngay thang trong do va KHONG HOI."
      evidence: "Sawada. / I am going to want to know what you are, eventually. / Xanxus did not ask. That was the part that went cold."
      aurel_H: "🔵 'Eventually' cua cau ta gio co mot cai lich. Day la thu Ch7 va cac arc sau se thu."

    kaneko:
      state_add: "Ban het muc den nang dung cho cao thi trang truoc thu Sau, khong hoi mot khach nao. Co mat tren bac den luc doc dieu khoan, voi con meo trong ao. Ve sau goi day la muoi mot phut dang tu hao nhat doi minh."
      evidence: "said afterwards that it was the proudest eleven minutes of her life and that she had not understood a word of the middle section"

    ishii:
      state_add: "Nguoi NHAN TIN DAU TIEN, tu chau trai lai tau o Maizuru. Va la nguoi de xuat cach ung xu cuoi cung duoc chon: ra ga don ho bang MOT TAM BAN DO."
      evidence: "a map is a very hard thing to refuse and an even harder thing to be rude to"

    tomoko:
      state_add: "Dong phong kham luc ba gio, mo lai luc ba ruoi voi cua chop ha sat be. Bay san mot khay dung cu chua bay ra ke tu mua dong le cuoi cao, va khong cat di suot muoi mot ngay. Xu ly vet thuong cua Ayame."
      evidence: "She then spent an hour laying out a tray of things she had not laid out since the winter of the fox wedding, and did not put it away again for eleven days."

    maro:
      state_add: "Di het vong ngoai hom thu Bay — viec ba dang le khong con di duoc nua. Bao 'khong thay gi', va ca thi tran hieu do la mot PHEP DO chu khong phai mot khoang trong."
      evidence: "everyone understood that nothing from Maro is a measurement rather than an absence"

    sachiko:
      state_add: "Cat dao khoi mat tien cua hang truoc khi bat cu ai bao co chuyen gi. Da o Namimori muoi mot nam, va den day tu hai tinh khac, nen van duoc thi tran coi la nguoi ngoai theo nghia ky thuat."
      evidence: "Sachiko took the knives out of the front of the shop and put them at the back, and did not explain why to her husband, who did not ask."

    reborn:
      state_add: "🔴 BON THANG SAU su kien: doc dong ghi ban ngung ban trong so cua phia Y, va DOC HAI LAN — dieu bat thuong voi ong. Thay mot cai ten chua tung co trong so ay, mot danh hieu ong KHONG NHAN RA, va mot con so tuoi: bay. Lat sang trang sau, nhung NHO CAI TEN."
      evidence: "He read it twice, which was unusual for him, and which he would not have been able to explain if asked. / But he remembered the name."
      aurel_I: "🔴 Day la mui chi dau tien cua hook-tsunashige-va-reborn, va no dat dung mot mach: Reborn co ten cau tu nam cau bay tuoi, chu khong phai gap tinh co nam muoi tam."

