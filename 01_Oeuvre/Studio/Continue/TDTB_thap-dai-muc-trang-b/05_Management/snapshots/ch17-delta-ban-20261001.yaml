  aurel:
    - "AUREL (1): h-0038 — `paid` hay `partially_paid`? Doc ky: ghi chu hook hua mot KET QUA ('Chua co ket qua'), va ket qua da ve: 'khong lo hong'. Nhung alias hook la 'vi sao Yamamoto thich Tsuna', va trang de ngo cau hoi ay (「那山本武凭什么对沢田纲吉几乎是一见钟情？」, 0038 lap lai y cu, doan 'don gian la thich'). Plan 01/10 viet 'paid'; delta de xuat dung `paid` (cau hoi 'vi sao' chuyen sang ky-uc-tuong-lai / h-59-danh-thuc-ky-uc). Neu Aurel coi hook la CAU HOI 'vi sao' thi giu `open`/`partially_paid` — xoa dong `status: paid` o tren. Tu frontmatter `payoff.status` (unplanned -> paid, chapter -> ch17) state_apply KHONG tu sua duoc (chi top-level `status`), phai tay."
    - "AUREL (2): Dong co B cua Kenichi. Trang chi cho thay anh NOI cau 一见钟情 truoc camera; POV Tsuna 'chi thay be mat', khong co lo y do (keo Tuyet khoi Kesuke). Delta ghi hanh dong quan sat duoc, KHONG ghi 'dong co B da thanh hanh dong' vi dieu do chi suy tu ch16 + the canh 03. Aurel quyet: coi do la hanh dong cua dong co B (cap nhat qd-kenichi-loi-dung-truoc, hook) hay de ngo."
    - "AUREL (3): Khach toc bac o nha Sawada. Trang KHONG goi ten; viec do la Gokudera dua vao ch13 (qua cho Nana, 'mười đời mắt') + plan ch18 (chua xay ra). De h-gokudera la 'DAY NHE'. Them: Tsuna HA GIONG (「压低了声音」) vi co tai xe truoc khi noi cau cuoi — plan C10/D12 mac dinh 'Gokudera nghe duoc' nhung trang khien kha nang do kem chac hon; ch18 can tinh lai. Chua quyet o delta."
    - "AUREL (4): Tsuna co biet danh tinh minh bi dan mang doi ra khong? THE GIOI: da doi ra (「经网友自行比对，此人即为……嘉宾‘纲吉’」, N1a). TSUNA: doc 「3L：扒出来了，就是个普通人，也不知道节目组从哪儿找来的。」 va khong phan ung; trang KHONG cho thay cau ay nghi 'ho biet minh la ai'. Delta chi ghi world fact; KHONG ghi Tsuna 'learned'. Aurel quyet cau ay co chuyen tu 'khong biet' sang 'biet' khong."
    - "AUREL (5): new_entities o tren — note nhan vat tro ly thu am + hai event: lam hay khong (tat ca la de xuat, khong note nao duoc tao)."
    - "AUREL (6): 'Tap 1 da chac 50 van'. Chi la niem tin cua Tsuna (「第一集的五十万已经稳稳到手了」); trang khong cho thay tien da tra hay luc nao tra. Delta ghi nhu niem tin. Neu Aurel muon canon 'cat-xe tap 1 duoc tra' thi can mot dong rieng trong canon/cat-xe-50-van-tdtb."
    - "AUREL (7): Cau 「山本是我初中同学，就只是同学而已」 noi voi camera trong phong phong van rieng. Trang khong noi cau nay co len song / duoc phat hay khong (luat 10: phong rieng nay co the la kenh song). Delta ghi 'noi truoc camera', khong ghi 'khan gia nghe'."
    - "AUREL (8): (a) So du 积分 cua Tuyet — khong note nao theo doi (chi co 'bo 1000 diem mua chi nam', bang gia o luat 6) va trang cung khong neu (「一分都舍不得再花」); KHONG ghi con bao nhieu. Bang gia luat 6 can them 完整档案调阅 = 100. (b) Cau 'tu te' cua Tuyet nam o PHAN CAM TUONG (truoc phong rieng), khong phai luc cham diem; 'ung bien' chi duoc chung minh bang viec canh 01 khong bao truoc cau nao. (c) Tuyet cho Tsuna diem thap nhat moi la Y DINH — trang khong cho thay phieu."
    - "AUREL (9): chi de biet, khong anh huong state. (a) Nguoi ke chen vao danmaku trong canh POV Tsuna (「他不知道，这时候直播间里的弹幕已经刷成了一片。」 · 「在纲吉看不见的直播间里」) — giong ch14; delta khong cho Tsuna kien thuc ay. (b) Danmaku 「收音小哥又不能给他投票」 ngu y khan gia bo phieu cho khach; luat 5 ghi phieu CP, D10 bo phieu khan gia khoi viec xet loai — khong mau thuan nhung Aurel co the muon nhin lai. (c) Canh 01: 「鹿野雪咬牙切齿：“你给我闭嘴。”」 dung “” (thoai noi ra) trong phong da tat camera; neu chi nghi trong dau thi theo hard-rules phai la ‘’ (viec cua prose, khong phai state)."

